<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>CLWA — Millhaven</title>
  <style>
    :root { --chat-msg-max-h: 560px; }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #111; overflow: hidden; font-family: 'Segoe UI', sans-serif; }
    #game-canvas { display: block; cursor: crosshair; }
    #minimap {
      position: fixed; bottom: 12px; left: 12px; z-index: 15;
      width: 200px; height: 150px;
      background: rgba(10,15,20,0.75); border: 1px solid rgba(100,140,180,0.2);
      border-radius: 8px; pointer-events: auto; cursor: pointer;
    }

    /* HUD overlay */
    #hud {
      position: fixed; top: 0; left: 0; right: 0;
      display: flex; justify-content: space-between; align-items: center;
      padding: 8px 16px;
      background: linear-gradient(to bottom, rgba(0,0,0,0.7), transparent);
      pointer-events: none; z-index: 10;
    }
    #hud > * { pointer-events: auto; }
    .hud-left { color: #ddc; font-size: 14px; }
    .hud-left .day { color: #f90; font-weight: bold; }
    .hud-left .time { color: #8cf; }
    .hud-right { display: flex; gap: 8px; }
    .hud-btn {
      background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2);
      color: #ddc; padding: 4px 12px; border-radius: 4px; cursor: pointer; font-size: 12px;
    }
    .hud-btn:hover { background: rgba(255,255,255,0.2); }
    .hud-btn.active { background: rgba(100,200,100,0.3); border-color: #6c6; }
    #ws-status { width: 8px; height: 8px; border-radius: 50%; background: #f44; display: inline-block; margin-left: 8px; }
    #ws-status.connected { background: #4f4; }

    /* Event Feed */
    #event-feed {
      position: fixed; right: 0; top: 50px; width: 320px; bottom: 0;
      background: rgba(0,0,0,0.6); overflow-y: auto; padding: 8px;
      font-size: 11px; color: #ccc; z-index: 10;
    }
    .feed-item {
      padding: 4px 8px; margin-bottom: 2px; border-left: 3px solid #555;
      background: rgba(255,255,255,0.03);
    }
    .feed-item.crime { border-color: #f44; }
    .feed-item.conversation { border-color: #4af; }
    .feed-item.movement { border-color: #4a4; }
    .feed-item.thought { border-color: #fa4; }
    .feed-item.mood { border-color: #a4f; }
    .feed-item .time { color: #aaa; font-size: 10px; }

    /* Chat panel — centered overlay */
    #chat-panel {
      position: fixed; display: none; z-index: 25;
      left: 50%; top: 50%; transform: translate(-50%, -50%);
      width: 620px; max-height: 85vh;
      background: linear-gradient(135deg, rgba(20,28,38,0.65), rgba(30,40,55,0.7));
      border: 1px solid rgba(100,140,180,0.3);
      border-radius: 16px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.6), 0 0 40px rgba(60,120,180,0.1);
      backdrop-filter: blur(12px);
      overflow: hidden;
      animation: chatSlideIn 0.3s ease-out;
    }
    @keyframes chatSlideIn {
      from { opacity: 0; transform: translate(-50%, -45%) scale(0.95); }
      to { opacity: 1; transform: translate(-50%, -50%) scale(1); }
    }
    #chat-panel.open { display: flex; flex-direction: column; }

    #chat-header {
      display: flex; align-items: center; gap: 12px;
      padding: 14px 16px; border-bottom: 1px solid rgba(255,255,255,0.06);
      background: rgba(0,0,0,0.15);
    }
    #chat-avatar, #chat-player-avatar {
      width: 72px; height: 72px; border-radius: 12px;
      border: none; object-fit: cover;
      image-rendering: pixelated; background: rgba(40,55,75,0.6);
    }
    #chat-npc-info { flex: 1; min-width: 0; }
    #chat-npc-name { color: #e8dcc8; font-size: 16px; font-weight: 700; margin: 0; transition: color 0.5s; }
    #chat-npc-subtitle {
      color: #a0b0c0; font-size: 11px; text-transform: uppercase; letter-spacing: 1px;
      display: flex; align-items: center; gap: 0; flex-wrap: wrap;
    }
    #chat-npc-role { }
    #chat-npc-loc { opacity: 0.8; }
    #chat-npc-loc::before { content: ' \00b7 '; opacity: 0.5; }
    .chat-status-badge {
      display: inline-block; font-size: 9px; font-weight: 700; letter-spacing: 0.5px;
      padding: 1px 6px; border-radius: 4px; margin-left: 6px; vertical-align: middle;
    }
    .faction-badge {
      display: inline-block; font-size: 9px; font-weight: 700; letter-spacing: 0.3px;
      padding: 1px 5px; border-radius: 4px; margin-left: 5px; vertical-align: middle;
    }
    .shop-buy-btn {
      margin-left: auto; font-size: 10px; padding: 2px 8px; border-radius: 4px; cursor: pointer;
      background: rgba(240,192,64,0.15); color: #f0c040; border: 1px solid rgba(240,192,64,0.4);
    }
    .shop-buy-btn:hover { background: rgba(240,192,64,0.3); }
    .shop-buy-btn:disabled { opacity: 0.4; cursor: not-allowed; }
    .chat-status-badge.detained { background: rgba(220,60,60,0.25); color: #f88; border: 1px solid rgba(220,60,60,0.3); }
    .chat-status-badge.wanted { background: rgba(220,160,40,0.2); color: #fa4; border: 1px solid rgba(220,160,40,0.3); }
    .chat-status-badge.exiled, .chat-status-badge.fled { background: rgba(120,120,120,0.2); color: #999; border: 1px solid rgba(120,120,120,0.3); }

    /* Expandable details section */
    #chat-details-toggle {
      color: #8aa0b8; font-size: 10px; cursor: pointer; margin-top: 3px;
      display: flex; align-items: center; gap: 4px;
      user-select: none; transition: color 0.2s;
    }
    #chat-details-toggle:hover { color: #b0c8e0; }
    #chat-details-arrow {
      display: inline-block; font-size: 8px; transition: transform 0.3s ease;
    }
    #chat-details-toggle.open #chat-details-arrow { transform: rotate(90deg); }
    #chat-details-body {
      max-height: 0; overflow: hidden;
      transition: max-height 0.35s ease, padding 0.35s ease, opacity 0.3s ease;
      opacity: 0; padding: 0;
    }
    #chat-details-body.open {
      opacity: 1; padding: 6px 0 2px 0;
      overflow-y: scroll; max-height: 320px;
      scrollbar-width: thin; scrollbar-color: transparent transparent;
    }
    #chat-details-body.open:hover { scrollbar-color: rgba(255,255,255,0.08) transparent; }
    .chat-detail-item {
      font-size: 11px; color: #98aab8; line-height: 1.5; margin-bottom: 3px;
    }
    .chat-detail-item .detail-label {
      color: #6a7a8a; font-size: 9px; text-transform: uppercase; letter-spacing: 0.5px;
      display: block;
    }

    /* NPC Mind — sub-section accordion */
    .mind-section {
      border-top: 1px solid rgba(255,255,255,0.04); margin-top: 3px;
    }
    .mind-section:first-child { border-top: none; margin-top: 0; }
    .mind-header {
      display: flex; align-items: center; gap: 6px; padding: 6px 0;
      cursor: pointer; user-select: none; font-size: 12px; color: #8aaabe;
      transition: color 0.2s;
    }
    .mind-header:hover { color: #b0d0e8; }
    .mind-arrow {
      font-size: 8px; transition: transform 0.25s ease; display: inline-block; width: 12px;
    }
    .mind-header.open .mind-arrow { transform: rotate(90deg); }
    .mind-count {
      color: #8aacbc; font-size: 11px; margin-left: auto;
    }
    .mind-body {
      max-height: 0; overflow: hidden; opacity: 0;
      transition: max-height 0.3s ease, opacity 0.25s ease;
    }
    .mind-body.open {
      opacity: 1;
    }
    .mind-loading {
      font-size: 11px; color: #8aacbc; font-style: italic; padding: 4px 0;
    }

    /* Beliefs list */
    .belief-item {
      display: flex; align-items: center; gap: 8px; padding: 4px 0; font-size: 12px;
    }
    .belief-conf {
      width: 36px; height: 4px; background: rgba(255,255,255,0.06); border-radius: 2px; flex-shrink: 0;
    }
    .belief-conf-fill { height: 100%; border-radius: 2px; background: #5a8aba; }
    .belief-type { color: #9abaca; font-size: 10px; text-transform: uppercase; letter-spacing: 0.3px; }
    .belief-text { color: #a0b8c8; flex: 1; }
    .belief-source { color: #8aacbc; font-size: 10px; }

    /* Relationships list */
    .rel-item {
      display: flex; align-items: center; gap: 8px; padding: 4px 0; font-size: 12px;
    }
    .rel-name { color: #b0c8d8; min-width: 70px; }
    .rel-type-badge {
      font-size: 9px; text-transform: uppercase; letter-spacing: 0.3px;
      padding: 2px 5px; border-radius: 3px; color: #7a9aaa;
      background: rgba(60,100,140,0.1); border: 1px solid rgba(60,100,140,0.08);
    }
    .rel-bars { flex: 1; display: flex; flex-direction: column; gap: 2px; }
    .rel-bar { display: flex; align-items: center; gap: 4px; }
    .rel-bar-label { font-size: 9px; color: #8aacbc; width: 10px; }
    .rel-bar-bg { flex: 1; height: 3px; background: rgba(255,255,255,0.06); border-radius: 2px; }
    .rel-bar-fill { height: 100%; border-radius: 2px; }
    .rel-bar-val { font-size: 10px; color: #9abaca; width: 28px; text-align: right; font-family: monospace; }

    /* Goals list */
    .goal-item {
      display: flex; align-items: center; gap: 8px; padding: 4px 0; font-size: 12px;
    }
    .goal-state {
      font-size: 9px; text-transform: uppercase; padding: 2px 6px; border-radius: 3px;
    }
    .goal-state.active { color: #8aba6a; background: rgba(120,180,80,0.12); }
    .goal-state.pending { color: #ba8a4a; background: rgba(180,130,60,0.12); }
    .goal-text { color: #a0b8c8; flex: 1; }
    .goal-progress { color: #9abaca; font-size: 11px; font-family: monospace; }

    /* Personality */
    .trait-row {
      display: flex; align-items: center; gap: 8px; padding: 3px 0; font-size: 12px;
    }
    .trait-label { color: #7a9aaa; width: 16px; font-weight: 600; font-size: 11px; text-align: center; }
    .trait-bar-bg { flex: 1; height: 5px; background: rgba(255,255,255,0.06); border-radius: 3px; }
    .trait-bar-fill { height: 100%; border-radius: 3px; }
    .trait-val { color: #9abaca; font-size: 11px; width: 28px; text-align: right; font-family: monospace; }
    .enne-line { font-size: 12px; color: #a0b8c8; padding: 4px 0; }
    .enne-label { color: #9abaca; font-size: 10px; text-transform: uppercase; }

    #chat-bars { margin-top: 6px; display: flex; flex-direction: column; gap: 4px; }
    .chat-bar-row { display: flex; align-items: center; gap: 8px; }
    .chat-bar-label { color: #8a9aaa; font-size: 11px; text-transform: uppercase; letter-spacing: 0.5px; width: 38px; text-align: right; }
    .chat-bar-bg {
      flex: 1; height: 5px; background: rgba(255,255,255,0.08); border-radius: 3px; overflow: hidden;
    }
    .chat-bar-fill {
      height: 100%; border-radius: 3px; transition: width 0.5s, background 0.5s;
    }
    .chat-bar-val { color: #a0b0c0; font-size: 11px; min-width: 32px; text-align: right; font-family: monospace; }
    .chat-session-sep {
      text-align: center; font-size: 9px; color: #4a5a6a; padding: 6px 0 4px;
      letter-spacing: 0.5px;
    }
    .chat-session-sep::before, .chat-session-sep::after {
      content: ''; display: inline-block; width: 40px; height: 1px;
      background: rgba(255,255,255,0.06); vertical-align: middle; margin: 0 8px;
    }
    #chat-close {
      background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1);
      color: #8a9aaa; cursor: pointer; font-size: 18px;
      width: 32px; height: 32px; border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
      transition: background 0.15s, color 0.15s; flex-shrink: 0; align-self: flex-start;
    }
    #chat-close:hover { background: rgba(255,100,100,0.15); color: #f88; border-color: rgba(255,100,100,0.3); }

    #chat-messages {
      overflow-y: scroll; padding: 0 16px;
      max-height: var(--chat-msg-max-h); height: 0;
      font-size: 13px; line-height: 1.5;
      scrollbar-width: thin; scrollbar-color: transparent transparent;
      transition: height 0.35s ease, padding 0.35s ease;
    }
    #chat-messages:hover { scrollbar-color: rgba(255,255,255,0.1) transparent; }
    #chat-messages.has-messages {
      padding: 12px 16px;
      background: rgba(10,15,22,0.25);
    }
    .msg { margin-bottom: 10px; padding: 8px 12px; border-radius: 10px; max-width: 85%; }
    .msg-system {
      max-width: 100%; text-align: center; font-size: 10px; color: #6a7a8a;
      background: none; border: none; padding: 2px 0; margin-bottom: 6px;
      font-style: italic; letter-spacing: 0.3px;
    }
    .msg-il-toggle {
      display: inline-block; margin-top: 5px; font-size: 9px; color: #5a7a9a;
      cursor: pointer; user-select: none; transition: color 0.2s;
      padding: 2px 6px; border-radius: 4px; background: rgba(60,100,140,0.08);
      border: 1px solid rgba(60,100,140,0.1);
    }
    .msg-il-toggle:hover { color: #8ab0d0; background: rgba(60,100,140,0.15); }
    .msg-il-toggle.open { color: #8ab0d0; }
    .msg-il-details {
      max-height: 0; overflow: hidden; opacity: 0;
      transition: max-height 0.3s ease, opacity 0.25s ease, padding 0.3s ease;
      padding: 0; margin-top: 0;
    }
    .msg-il-details.open {
      opacity: 1; padding: 6px 0 2px; margin-top: 4px;
      border-top: 1px solid rgba(60,100,140,0.1);
    }
    .il-effect {
      font-size: 10px; color: #7a9ab0; line-height: 1.6; padding-left: 8px;
      border-left: 2px solid rgba(60,100,140,0.15);
      margin-bottom: 2px;
    }
    .il-effect .il-label { color: #8aacbc; font-size: 8px; text-transform: uppercase; letter-spacing: 0.5px; }
    .msg-npc {
      background: rgba(60,100,140,0.12); border: 1px solid rgba(60,100,140,0.08);
      color: #c8e4f4; margin-right: auto;
      border-bottom-left-radius: 4px;
    }
    .msg-player {
      background: rgba(180,140,60,0.1); border: 1px solid rgba(180,140,60,0.06);
      color: #f0e0b8; margin-left: auto;
      border-bottom-right-radius: 4px;
    }
    .msg b { font-size: 11px; opacity: 0.6; display: block; margin-bottom: 2px; }

    #chat-form {
      display: flex; padding: 10px 12px; gap: 8px;
      border-top: 1px solid rgba(255,255,255,0.06);
      background: rgba(0,0,0,0.1);
    }

    /* Player footer — mirror of NPC header */
    #chat-player-footer {
      display: flex; align-items: center; gap: 12px;
      padding: 10px 16px; border-top: 1px solid rgba(255,255,255,0.06);
      background: rgba(0,0,0,0.1);
    }
    #chat-player-info { flex: 1; text-align: right; min-width: 0; }
    #chat-player-name { color: #d0c090; font-size: 14px; font-weight: 600; }
    #chat-player-role { color: #8a8a6a; font-size: 10px; text-transform: uppercase; letter-spacing: 1px; }
    #chat-player-loc { color: #7a7a5a; font-size: 10px; }
    #chat-player-loc::after { content: ' \00b7'; opacity: 0.4; }
    #chat-input {
      flex: 1; background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.1);
      color: #ddc; padding: 10px 14px; border-radius: 10px; font-size: 13px;
      outline: none; transition: border-color 0.2s;
    }
    #chat-input:focus { border-color: rgba(100,160,220,0.4); }
    #chat-input::placeholder { color: rgba(255,255,255,0.2); }
    #chat-send {
      background: linear-gradient(135deg, #2a6a9a, #3a8aba); border: none;
      color: #fff; padding: 10px 20px; border-radius: 10px; cursor: pointer;
      font-size: 13px; font-weight: 600; transition: all 0.15s;
    }
    #chat-send:hover { background: linear-gradient(135deg, #3a7aaa, #4a9aca); }

    /* Shop button */
    #btn-shop {
      background: rgba(180,140,50,0.2); border: 1px solid rgba(180,140,50,0.3);
      color: #d0b060; padding: 10px 14px; border-radius: 10px; cursor: pointer;
      font-size: 13px; font-weight: 600; transition: all 0.15s; white-space: nowrap;
    }
    #btn-shop:hover { background: rgba(180,140,50,0.35); }
    #btn-shop.glow {
      animation: shopGlow 1s ease-in-out 3;
      box-shadow: 0 0 12px rgba(200,160,60,0.4);
    }
    @keyframes shopGlow {
      0%, 100% { box-shadow: 0 0 4px rgba(200,160,60,0.2); }
      50% { box-shadow: 0 0 16px rgba(200,160,60,0.5); }
    }

    /* Shop panel — slides in from bottom of chat */
    #shop-panel {
      display: none; max-height: 200px; overflow-y: auto;
      border-top: 1px solid rgba(255,255,255,0.06);
      background: rgba(10,20,30,0.4); padding: 8px 12px;
      scrollbar-width: thin; scrollbar-color: transparent transparent;
    }
    #shop-panel:hover { scrollbar-color: rgba(255,255,255,0.08) transparent; }
    #shop-panel.open { display: block; }
    .shop-title {
      font-size: 11px; color: #8a9aaa; text-transform: uppercase; letter-spacing: 1px;
      margin-bottom: 6px; display: flex; align-items: center; justify-content: space-between;
    }
    .shop-close { cursor: pointer; color: #6a7a8a; font-size: 14px; }
    .shop-close:hover { color: #f88; }
    .shop-item {
      display: flex; align-items: center; gap: 10px; padding: 6px 8px;
      border-radius: 6px; margin-bottom: 4px; transition: background 0.15s;
    }
    .shop-item:hover { background: rgba(255,255,255,0.04); }
    .shop-item-name { color: #c8d8e8; font-size: 12px; font-weight: 600; flex: 1; }
    .shop-item-price { color: #d0b060; font-size: 11px; font-weight: 600; }
    .shop-item-desc { color: #7a8a9a; font-size: 10px; flex-basis: 100%; margin-top: 2px; }

    /* Examine panel — crime scene investigation */
    #examine-panel {
      display: none; position: fixed; bottom: 80px; left: 50%; transform: translateX(-50%);
      z-index: 20; width: 400px; max-height: 60vh; overflow-y: auto;
      background: rgba(20,28,38,0.9); color: #cdd8e0;
      border: 1px solid rgba(100,140,180,0.25); border-radius: 12px;
      backdrop-filter: blur(10px); padding: 16px;
      font-size: 13px; line-height: 1.5;
      animation: panel-appear 0.25s ease-out;
    }
    @keyframes panel-appear {
      from { opacity: 0; transform: translateX(-50%) translateY(10px); }
      to { opacity: 1; transform: translateX(-50%) translateY(0); }
    }
    .examine-title {
      color: #b89a50; font-weight: 600; font-size: 14px;
      border-bottom: 1px solid rgba(184,154,80,0.2); padding-bottom: 8px; margin-bottom: 10px;
    }
    .examine-intro { color: #8a9aaa; font-style: italic; margin-bottom: 12px; font-size: 12px; }
    .examine-point {
      background: rgba(255,255,255,0.03); border-left: 3px solid #4a6a8a;
      padding: 10px 12px; margin-bottom: 8px; border-radius: 0 6px 6px 0;
      transition: border-left-color 0.3s ease, opacity 0.3s ease;
    }
    .examine-point.examined { border-left-color: #4a8a5a; opacity: 0.7; }
    .examine-point-desc { margin-bottom: 6px; }
    .examine-point-clue {
      color: #8aba8a; font-style: italic; font-size: 12px;
      padding-top: 4px; border-top: 1px solid rgba(255,255,255,0.05);
    }
    .examine-btn {
      background: rgba(100,160,220,0.2); border: 1px solid rgba(100,160,220,0.3);
      color: #8ac8f0; padding: 4px 14px; border-radius: 5px; cursor: pointer;
      font-size: 12px; font-weight: 500; transition: background 0.2s, opacity 0.2s; margin-top: 4px;
    }
    .examine-btn:hover { background: rgba(100,160,220,0.35); }
    .examine-btn:disabled { opacity: 0.4; cursor: default; }
    .examine-leave {
      display: block; margin: 10px auto 0; background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.1); color: #8a9aaa; padding: 5px 20px;
      border-radius: 5px; cursor: pointer; font-size: 12px; transition: background 0.2s, color 0.2s;
    }
    .examine-leave:hover { background: rgba(255,255,255,0.12); color: #bcc8d0; }
    .examine-done { color: #8a9aaa; text-align: center; font-style: italic; margin-top: 8px; font-size: 12px; }

    /* Journal panel — left side */
    #journal-panel {
      position: fixed; left: 0; top: 0; bottom: 0; width: 300px; z-index: 20;
      background: linear-gradient(135deg, rgba(20,28,38,0.9), rgba(30,40,55,0.9));
      border-right: 1px solid rgba(100,140,180,0.2); backdrop-filter: blur(8px);
      transform: translateX(-100%); transition: transform 0.3s ease;
      display: flex; flex-direction: column; overflow: hidden;
    }
    #journal-panel.open { transform: translateX(0); }
    .journal-header {
      padding: 16px; border-bottom: 1px solid rgba(255,255,255,0.06);
      display: flex; align-items: center; justify-content: space-between;
    }
    .journal-title { color: #d0c8b0; font-size: 16px; font-weight: 700; }
    .journal-close { cursor: pointer; color: #8a9aaa; font-size: 18px; }
    .journal-close:hover { color: #f88; }
    .journal-body {
      flex: 1; overflow-y: auto; padding: 12px;
      scrollbar-width: thin; scrollbar-color: transparent transparent;
    }
    .journal-body:hover { scrollbar-color: rgba(255,255,255,0.08) transparent; }
    .journal-empty { color: #5a6a7a; font-style: italic; font-size: 12px; text-align: center; padding: 20px; }
    .journal-filter-bar {
      display: flex; gap: 4px; padding: 4px 6px 8px; flex-wrap: wrap;
      border-bottom: 1px solid rgba(255,255,255,0.04); margin-bottom: 6px;
    }
    .journal-filter-btn {
      font-size: 9px; text-transform: capitalize; padding: 2px 8px;
      border-radius: 3px; cursor: pointer; border: 1px solid rgba(255,255,255,0.1);
      background: rgba(255,255,255,0.03); color: #6a7a8a; transition: background 0.15s, color 0.15s, border-color 0.15s;
    }
    .journal-filter-btn:hover { background: rgba(255,255,255,0.08); }
    .journal-filter-btn.active { border-color: #b89a50; color: #b89a50; background: rgba(184,154,80,0.1); }
    .journal-entry {
      padding: 8px 10px; margin-bottom: 6px; border-radius: 6px;
      background: rgba(255,255,255,0.03); border-left: 2px solid rgba(100,140,180,0.2);
      font-size: 11px; color: #a0b0c0; line-height: 1.5;
    }
    .journal-entry-day { color: #8aacbc; font-size: 9px; text-transform: uppercase; }
    .journal-entry-text { margin-top: 2px; }

    /* Journal tabs */
    .journal-tabs {
      display: flex; gap: 0; border-bottom: 1px solid rgba(255,255,255,0.06);
    }
    .journal-tab {
      flex: 1; padding: 8px 12px; background: none; border: none;
      color: #5a6a7a; font-size: 11px; cursor: pointer; text-align: center;
      border-bottom: 2px solid transparent; transition: all 0.15s;
    }
    .journal-tab:hover { color: #8a9aaa; }
    .journal-tab.active { color: #d0c8b0; border-bottom-color: #c0b080; }
    .journal-tab-count {
      display: inline-block; min-width: 14px; padding: 0 4px;
      background: rgba(220,160,60,0.2); color: #da4; border-radius: 8px;
      font-size: 9px; font-weight: 700; line-height: 14px; margin-left: 4px;
    }
    .journal-tab-count:empty { display: none; }

    /* Journal entry — enhanced */
    .journal-entry-header {
      display: flex; align-items: center; justify-content: space-between; gap: 6px;
    }
    .journal-entry-type {
      font-size: 8px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px;
      padding: 1px 5px; border-radius: 3px; flex-shrink: 0;
    }
    .journal-entry-type.clue { background: rgba(180,160,100,0.2); color: #c0b080; }
    .journal-entry-type.testimony { background: rgba(100,160,255,0.15); color: #6af; }
    .journal-entry-type.observation { background: rgba(100,180,100,0.15); color: #6a6; }
    .journal-entry-meta {
      display: flex; align-items: center; gap: 6px; margin-top: 4px; flex-wrap: wrap;
    }
    .journal-badge {
      font-size: 8px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.3px;
      padding: 1px 5px; border-radius: 3px;
    }
    .journal-badge.physical { background: rgba(220,80,80,0.15); color: #f88; }
    .journal-badge.motive { background: rgba(220,160,60,0.15); color: #da4; }
    .journal-badge.opportunity { background: rgba(80,180,80,0.15); color: #6c6; }
    .journal-badge.witness { background: rgba(100,160,255,0.15); color: #6af; }
    .journal-badge.alibi { background: rgba(160,100,220,0.15); color: #a6f; }
    .journal-weight { font-size: 9px; color: #5a6a7a; font-weight: 600; }
    .journal-suspect-link {
      font-size: 9px; color: #da4; cursor: pointer; margin-left: auto;
    }
    .journal-suspect-link:hover { text-decoration: underline; }
    .journal-presented { font-size: 8px; color: #4a5a6a; font-style: italic; }

    /* Suspect grouping */
    .journal-suspect-group {
      margin-bottom: 10px; border-radius: 6px; overflow: hidden;
      border: 1px solid rgba(255,255,255,0.04);
    }
    .journal-suspect-header {
      display: flex; align-items: center; gap: 8px;
      padding: 8px 10px; cursor: pointer;
      background: rgba(255,255,255,0.04);
    }
    .journal-suspect-header:hover { background: rgba(255,255,255,0.06); }
    .journal-suspect-name { color: #d0c8b0; font-size: 12px; font-weight: 600; flex: 1; }
    .journal-case-quality {
      font-size: 8px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px;
      padding: 1px 6px; border-radius: 3px;
    }
    .journal-case-quality.strong { background: rgba(80,180,80,0.2); color: #6c6; }
    .journal-case-quality.moderate { background: rgba(220,160,60,0.2); color: #da4; }
    .journal-case-quality.weak { background: rgba(220,80,80,0.2); color: #f88; }
    .journal-case-quality.insufficient { background: rgba(100,100,100,0.2); color: #aaa; }
    .journal-case-score { font-size: 9px; color: #5a6a7a; }
    .journal-suspect-toggle {
      font-size: 8px; font-weight: 600; text-transform: uppercase;
      padding: 2px 6px; border-radius: 3px; cursor: pointer; border: none;
      background: rgba(100,100,100,0.2); color: #aaa; transition: background 0.15s, color 0.15s;
    }
    .journal-suspect-toggle.active { background: rgba(220,80,80,0.2); color: #f88; }
    .journal-suspect-toggle:hover { filter: brightness(1.2); }
    .journal-suspect-entries { padding: 4px 6px; }
    .journal-suspect-entries .journal-entry { margin-bottom: 4px; }
    .journal-suspect-group.collapsed .journal-suspect-entries,
    .journal-suspect-group.collapsed .journal-case-breakdown { display: none; }
    .journal-case-breakdown {
      display: flex; gap: 8px; padding: 6px 10px;
      border-top: 1px solid rgba(255,255,255,0.04);
      font-size: 9px; color: #5a6a7a;
    }
    .journal-case-breakdown span { white-space: nowrap; }
    .journal-case-btn {
      font-size: 8px; font-weight: 600; text-transform: uppercase;
      padding: 2px 6px; border-radius: 3px; cursor: pointer; border: none;
      background: rgba(100,160,220,0.15); color: #6a9aca; transition: background 0.15s, color 0.15s;
    }
    .journal-case-btn:hover { background: rgba(100,160,220,0.3); }
    .journal-section-title {
      color: #5a6a7a; font-size: 9px; text-transform: uppercase; letter-spacing: 1px;
      padding: 8px 0 4px; margin-top: 8px;
    }

    /* Case review */
    .case-review { padding: 4px 0; }
    .case-review-title {
      color: #b89a50; font-weight: 600; font-size: 13px;
      padding-bottom: 8px; margin-bottom: 8px;
      border-bottom: 1px solid rgba(184,154,80,0.2);
    }
    .case-review-summary { margin-bottom: 10px; }
    .case-review-cat {
      display: flex; justify-content: space-between; padding: 4px 8px;
      font-size: 12px; color: #a0b8c8;
      border-left: 2px solid #4a6a8a;
      margin-bottom: 2px; background: rgba(255,255,255,0.02);
    }
    .case-cat-name { text-transform: capitalize; }
    .case-cat-count { color: #9abaca; font-weight: 600; }
    .case-review-divider {
      color: #5a6a7a; font-size: 9px; text-transform: uppercase; letter-spacing: 1px;
      padding: 6px 0; margin-bottom: 6px;
      border-top: 1px solid rgba(255,255,255,0.05);
    }
    .case-review-entry {
      padding: 6px 8px; margin-bottom: 4px;
      background: rgba(255,255,255,0.02); border-radius: 4px;
    }
    .case-review-entry-text { font-size: 11px; color: #b0c0d0; margin-bottom: 3px; }
    .case-review-entry-meta { display: flex; align-items: center; gap: 6px; font-size: 9px; color: #5a6a7a; }
    .case-meta-info { font-style: italic; }
    .case-review-back {
      display: block; margin: 12px auto 0; background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.1); color: #8a9aaa; padding: 5px 16px;
      border-radius: 5px; cursor: pointer; font-size: 11px; transition: background 0.2s, color 0.2s;
    }
    .case-review-back:hover { background: rgba(255,255,255,0.12); color: #bcc8d0; }

    /* Detective intuition hint */
    #detective-hint {
      padding: 8px 12px; margin: 0;
      background: rgba(180,140,50,0.08);
      border-top: 1px solid rgba(184,154,80,0.15);
      color: #b89a50; font-style: italic; font-size: 12px; line-height: 1.4;
      position: relative;
    }
    #detective-hint .hint-close {
      position: absolute; top: 4px; right: 8px; cursor: pointer;
      color: #6a5a3a; font-size: 14px; line-height: 1;
    }
    #detective-hint .hint-close:hover { color: #b89a50; }

    /* Evidence presenter in chat */
    #evidence-presenter {
      display: none; max-height: 180px; overflow-y: auto;
      padding: 8px; border-top: 1px solid rgba(255,255,255,0.06);
      background: rgba(0,0,0,0.15);
      scrollbar-width: thin; scrollbar-color: transparent transparent;
    }
    #evidence-presenter:hover { scrollbar-color: rgba(255,255,255,0.08) transparent; }
    #evidence-presenter.open { display: block; }
    .evidence-title {
      color: #6a8aaa; font-size: 9px; text-transform: uppercase; letter-spacing: 1px;
      margin-bottom: 4px;
    }
    .evidence-item {
      display: flex; align-items: flex-start; gap: 6px;
      padding: 5px 8px; margin-bottom: 2px; border-radius: 4px;
      cursor: pointer; font-size: 10px; color: #a0b0c0;
      background: rgba(255,255,255,0.02); transition: background 0.1s;
    }
    .evidence-item:hover { background: rgba(255,255,255,0.05); }
    .evidence-item.selected { background: rgba(100,160,220,0.1); }
    .evidence-item.already-shown { opacity: 0.4; pointer-events: none; }
    .evidence-item-check {
      width: 12px; height: 12px; border-radius: 3px; flex-shrink: 0; margin-top: 1px;
      border: 1px solid rgba(255,255,255,0.15); background: rgba(255,255,255,0.03);
    }
    .evidence-item.selected .evidence-item-check { background: #4af; border-color: #4af; }
    .evidence-item-text { flex: 1; line-height: 1.3; }
    .evidence-item-shown { font-size: 8px; color: #4a5a6a; font-style: italic; }
    .evidence-empty { color: #4a5a6a; font-size: 10px; font-style: italic; padding: 8px; text-align: center; }
    .evidence-selected-tags {
      display: flex; flex-wrap: wrap; gap: 4px; padding: 4px 12px 0;
    }
    .evidence-selected-tags:empty { display: none; padding: 0; }
    .evidence-tag {
      font-size: 9px; padding: 2px 8px; border-radius: 4px;
      background: rgba(100,160,220,0.15); color: #6af; cursor: pointer;
    }
    .evidence-tag:hover { background: rgba(220,80,80,0.2); color: #f88; }
    #btn-evidence {
      background: rgba(100,160,220,0.15); border: 1px solid rgba(100,160,220,0.2);
      color: #6af; padding: 10px 12px; border-radius: 10px; cursor: pointer;
      font-size: 11px; font-weight: 600; transition: all 0.15s; white-space: nowrap;
    }
    #btn-evidence:hover { background: rgba(100,160,220,0.25); }
    #btn-evidence.has-selection { background: rgba(100,160,220,0.3); border-color: #4af; }

    /* Journal button in HUD */
    .btn-journal {
      background: rgba(180,160,100,0.15); border: 1px solid rgba(180,160,100,0.2);
      color: #c0b080; padding: 4px 12px; border-radius: 6px; cursor: pointer;
      font-size: 11px; transition: all 0.15s;
    }
    .btn-journal:hover { background: rgba(180,160,100,0.25); }

    /* Toast notifications */
    #toast-container {
      position: fixed; top: 16px; right: 16px; z-index: 40;
      display: flex; flex-direction: column; gap: 8px; pointer-events: none;
      max-width: 360px;
    }
    .toast {
      padding: 10px 16px; border-radius: 10px; font-size: 13px; line-height: 1.4;
      backdrop-filter: blur(8px); pointer-events: auto;
      animation: toastIn 0.3s ease-out;
      border-left: 3px solid;
    }
    .toast.fade-out { animation: toastOut 0.4s ease-in forwards; }
    .toast-murder    { background: rgba(180,40,40,0.85); color: #fcc; border-color: #f44; }
    .toast-arrest    { background: rgba(40,80,160,0.85); color: #cdf; border-color: #48f; }
    .toast-sentence  { background: rgba(120,40,160,0.85); color: #dcf; border-color: #a4f; }
    .toast-discovery { background: rgba(180,120,30,0.85); color: #fed; border-color: #fa4; }
    .toast-theft     { background: rgba(160,140,30,0.85); color: #ffc; border-color: #cc4; }
    .toast-approach  { background: rgba(40,140,80,0.85); color: #cfc; border-color: #4a4; }
    .toast-crime     { background: rgba(160,40,40,0.85); color: #fcc; border-color: #c44; }
    .toast-info      { background: rgba(40,60,80,0.85); color: #cde; border-color: #68a; }
    @keyframes toastIn { from { opacity: 0; transform: translateX(40px); } to { opacity: 1; transform: translateX(0); } }
    @keyframes toastOut { from { opacity: 1; } to { opacity: 0; transform: translateY(-10px); } }

    /* NPC tooltip on hover */
    #tooltip {
      position: fixed; display: none; background: rgba(0,0,0,0.85);
      border: 1px solid #444; border-radius: 6px; padding: 8px 12px;
      color: #ddc; font-size: 11px; z-index: 30; pointer-events: none;
      max-width: 200px;
    }
    #tooltip .name { font-weight: bold; font-size: 13px; }
    #tooltip .role { color: #aaa; }
    #tooltip .mood-bar { height: 4px; border-radius: 2px; margin-top: 4px; }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>
<body>

<div id="hud">
  <div class="hud-left">
    <span>MILLHAVEN</span> — Day <span class="day" id="hud-day">1</span>
    <span class="time" id="hud-time">07:00</span>
    <span id="hud-period">morning</span>
    <span id="hud-gold" style="color:#f0c040;font-size:11px;margin-left:10px" title="Your gold">&#128176; 0g</span>
    <span id="hud-justice" style="color:#7fc8ff;font-size:11px;margin-left:8px" title="Your standing with the Magistrate (justice progress)">&#9878; 0</span>
    <span id="hud-speed" style="font-size:10px;margin-left:8px"></span>
    <span id="hud-clues" style="color:#c8a;font-size:10px;margin-left:8px"></span>
    <span id="hud-seed" style="color:#555;font-size:10px;margin-left:8px;cursor:pointer" title="Click to copy seed" onclick="navigator.clipboard.writeText(this.dataset.seed)"></span>
    <span id="ws-status"></span>
  </div>
  <div class="hud-right">
    <button class="hud-btn" id="btn-tick">Tick</button>
    <button class="hud-btn" id="btn-auto">Auto</button>
    <button class="hud-btn" id="btn-day">Day</button>
    <button class="hud-btn" id="btn-examine" style="display:none;color:#f44;border-color:rgba(255,80,80,0.3)" onclick="openExaminePanel()">Investigate</button>
    <button class="btn-journal" id="btn-journal" onclick="toggleJournal()">Journal</button>
    <button class="hud-btn" id="btn-new-game" style="color:#f88;border-color:rgba(220,80,80,0.3)">New Game</button>
  </div>
</div>

<div id="event-feed"></div>

<div id="chat-panel">
  <div id="chat-header">
    <img id="chat-avatar" src="" alt="">
    <div id="chat-npc-info">
      <div id="chat-npc-name"></div>
      <div id="chat-npc-subtitle">
        <span id="chat-npc-role"></span><span id="chat-npc-loc"></span>
        <span id="chat-status-badge" class="chat-status-badge" style="display:none"></span>
        <span id="chat-faction-badges"></span>
      </div>
      <div id="chat-npc-econ" style="font-size:10px;font-family:monospace;color:#cbb;margin-top:2px;display:none"></div>
      <div id="chat-details-toggle" onclick="toggleChatDetails()">
        <span id="chat-details-arrow">&#9654;</span> <span id="chat-details-label">NPC Mind</span>
      </div>
      <div id="chat-details-body">
        <div class="chat-detail-item">
          <span id="chat-npc-background" style="color:#90a8b8;font-style:italic"></span>
        </div>
        <div class="mind-section" id="mind-beliefs">
          <div class="mind-header" role="button" tabindex="0" onclick="toggleMindSection('beliefs')" onkeydown="if(event.key==='Enter'||event.key===' ')toggleMindSection('beliefs')">
            <span class="mind-arrow">&#9654;</span> Beliefs <span class="mind-count" id="mind-beliefs-count"></span>
          </div>
          <div class="mind-body" id="mind-beliefs-body"></div>
        </div>
        <div class="mind-section" id="mind-relationships">
          <div class="mind-header" role="button" tabindex="0" onclick="toggleMindSection('relationships')" onkeydown="if(event.key==='Enter'||event.key===' ')toggleMindSection('relationships')">
            <span class="mind-arrow">&#9654;</span> Relationships <span class="mind-count" id="mind-relationships-count"></span>
          </div>
          <div class="mind-body" id="mind-relationships-body"></div>
        </div>
        <div class="mind-section" id="mind-goals">
          <div class="mind-header" role="button" tabindex="0" onclick="toggleMindSection('goals')" onkeydown="if(event.key==='Enter'||event.key===' ')toggleMindSection('goals')">
            <span class="mind-arrow">&#9654;</span> Goals <span class="mind-count" id="mind-goals-count"></span>
          </div>
          <div class="mind-body" id="mind-goals-body"></div>
        </div>
        <div class="mind-section" id="mind-personality">
          <div class="mind-header" role="button" tabindex="0" onclick="toggleMindSection('personality')" onkeydown="if(event.key==='Enter'||event.key===' ')toggleMindSection('personality')">
            <span class="mind-arrow">&#9654;</span> Personality
          </div>
          <div class="mind-body" id="mind-personality-body"></div>
        </div>
      </div>
      <div id="chat-bars">
        <div class="chat-bar-row">
          <span class="chat-bar-label">Trust</span>
          <div class="chat-bar-bg"><div id="chat-trust-bar" class="chat-bar-fill"></div></div>
          <span id="chat-trust-val" class="chat-bar-val"></span>
        </div>
        <div class="chat-bar-row">
          <span class="chat-bar-label">Mood</span>
          <div class="chat-bar-bg"><div id="chat-mood-bar" class="chat-bar-fill"></div></div>
          <span id="chat-mood-val" class="chat-bar-val"></span>
        </div>
      </div>
    </div>
    <button id="chat-close" aria-label="Close chat">&times;</button>
  </div>
  <div id="chat-messages"></div>
  <div id="detective-hint" style="display:none"></div>
  <div id="shop-panel">
    <div class="shop-title"><span>Shop</span><span class="shop-close" onclick="closeShop()">&times;</span></div>
    <div id="shop-items"></div>
  </div>
  <div id="evidence-presenter"></div>
  <div class="evidence-selected-tags" id="evidence-tags"></div>
  <form id="chat-form">
    <input id="chat-input" type="text" placeholder="Type a message..." autocomplete="off" aria-label="Chat message">
    <button id="btn-evidence" type="button" onclick="toggleEvidencePresenter()">Evidence</button>
    <button id="btn-shop" type="button" style="display:none" onclick="toggleShop()">Shop</button>
    <button id="btn-bribe" type="button" title="Slip them coin to win favor" onclick="bribeCurrentNpc()">Bribe 10g</button>
    <button id="chat-send" type="submit">Send</button>
  </form>
  <div id="chat-player-footer">
    <div id="chat-player-info">
      <span id="chat-player-name">Traveler</span>
      <div>
        <span id="chat-player-role">traveler</span>
        <span id="chat-player-loc"></span>
      </div>
      <div style="display:flex;gap:10px;justify-content:flex-end;margin-top:2px">
        <span id="chat-player-mood" style="font-size:10px;font-family:monospace"></span>
        <span id="chat-player-beliefs" style="font-size:10px;color:#9abaca"></span>
      </div>
      <div id="chat-player-econ" style="font-size:10px;font-family:monospace;color:#f0c040;text-align:right;margin-top:2px"></div>
    </div>
    <img id="chat-player-avatar" src="" alt="">
  </div>
</div>

<div id="tooltip">
  <div class="name"></div>
  <div class="role"></div>
  <div class="mood-bar"></div>
</div>

<div id="examine-panel"></div>

<div id="journal-panel">
  <div class="journal-header">
    <span class="journal-title">Journal</span>
    <span class="journal-close" role="button" aria-label="Close journal" onclick="toggleJournal()">&times;</span>
  </div>
  <div class="journal-tabs">
    <button class="journal-tab active" id="journal-tab-all" onclick="setJournalTab('all')">All</button>
    <button class="journal-tab" id="journal-tab-suspects" onclick="setJournalTab('suspects')">Suspects <span id="journal-suspect-count" class="journal-tab-count"></span></button>
  </div>
  <div class="journal-body" id="journal-body">
    <div class="journal-empty">No entries yet. Examine crime scenes to collect evidence.</div>
  </div>
</div>

<div id="toast-container"></div>
<canvas id="minimap" width="200" height="150" role="img" aria-label="Town minimap"></canvas>
<canvas id="game-canvas" role="application" aria-label="Game world"></canvas>
<script src="game.js"></script>
</body>
</html>

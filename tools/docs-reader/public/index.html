<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CLWA Docs Reader</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-brand">
        <h1>CLWA</h1>
        <p>Docs Reader</p>
      </div>

      <div class="sidebar-search">
        <div class="search-wrap">
          <svg class="search-icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5">
            <circle cx="6.5" cy="6.5" r="5"/>
            <line x1="10.2" y1="10.2" x2="14.5" y2="14.5"/>
          </svg>
          <input type="text" class="search-input" id="search-input" placeholder="Search docs..." autocomplete="off" spellcheck="false">
          <div class="search-results" id="search-results"></div>
        </div>
      </div>

      <div class="sidebar-nav-actions" id="sidebar-nav-actions"></div>
      <div class="sidebar-tree" id="sidebar-tree"></div>

      <div class="sidebar-footer">
        <button class="theme-toggle" id="theme-toggle" aria-label="Toggle theme">
          <svg class="theme-toggle-icon" id="theme-icon" viewBox="0 0 16 16" fill="currentColor"></svg>
          <span id="theme-label">Dark</span>
        </button>
      </div>
    </aside>

    <!-- Mobile overlay -->
    <div class="sidebar-overlay" id="sidebar-overlay"></div>

    <!-- Main -->
    <main class="main" id="main">
      <div class="history-bar" id="history-bar">
        <button class="history-btn" id="history-back" title="Back" disabled>&larr;</button>
        <button class="history-btn" id="history-forward" title="Forward" disabled>&rarr;</button>
        <div class="history-list" id="history-list"></div>
      </div>

      <div class="doc-toolbar" id="doc-toolbar" style="display:none">
        <nav class="breadcrumb" id="breadcrumb"></nav>
        <div class="toolbar-actions" id="toolbar-actions"></div>
      </div>

      <div class="content-body" id="content-body">
        <div class="welcome">
          <div>
            <div class="welcome-title">CLWA Docs Reader</div>
            <div class="welcome-sub">Select a document from the sidebar</div>
          </div>
        </div>
      </div>
    </main>
  </div>

  <!-- Hamburger -->
  <button class="hamburger" id="hamburger" aria-label="Open navigation">
    <svg viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
      <line x1="2" y1="4" x2="16" y2="4"/>
      <line x1="2" y1="9" x2="16" y2="9"/>
      <line x1="2" y1="14" x2="16" y2="14"/>
    </svg>
  </button>

  <!-- Toast -->
  <div id="toast" class="toast toast-success"></div>

  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script>
  /**
   * CLWA Docs Reader -- UI logic
   * Design matches World Editor (dark detective-noir theme)
   */

  // ============================================================
  // SVG ICONS (inline, no external deps)
  // ============================================================
  const ICONS = {
    folder: '<path d="M2 3.5A1.5 1.5 0 013.5 2h2.764a1.5 1.5 0 011.025.404l1.122 1.044A.5.5 0 008.752 3.5H12.5A1.5 1.5 0 0114 5v7.5a1.5 1.5 0 01-1.5 1.5h-9A1.5 1.5 0 012 12.5v-9z" fill="currentColor"/>',
    file: '<path d="M3.5 2A1.5 1.5 0 002 3.5v9A1.5 1.5 0 003.5 14h9a1.5 1.5 0 001.5-1.5V5.621a1.5 1.5 0 00-.44-1.06L10.94 1.94A1.5 1.5 0 009.879 1.5H3.5z" fill="none" stroke="currentColor" stroke-width="1.2"/><path d="M9.5 1.5v3a1 1 0 001 1h3" fill="none" stroke="currentColor" stroke-width="1.2"/>',
    chevron: '<path d="M5 2l6 6-6 6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>',
    edit: '<path d="M11.5 1.5l3 3L5 14H2v-3L11.5 1.5z" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linejoin="round"/>',
    save: '<path d="M12.5 14.5h-9a1 1 0 01-1-1v-11a1 1 0 011-1h7l3 3v9a1 1 0 01-1 1z" fill="none" stroke="currentColor" stroke-width="1.2"/><rect x="5" y="9" width="6" height="4" rx="0.5" fill="none" stroke="currentColor" stroke-width="1"/>',
    cancel: '<line x1="4" y1="4" x2="12" y2="12" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><line x1="12" y1="4" x2="4" y2="12" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>',
    clock: '<circle cx="8" cy="8" r="6.5" fill="none" stroke="currentColor" stroke-width="1.2"/><polyline points="8,4 8,8 11,10" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/>',
    fileSize: '<path d="M3 2h8l3 3v9a1 1 0 01-1 1H3a1 1 0 01-1-1V3a1 1 0 011-1z" fill="none" stroke="currentColor" stroke-width="1"/><line x1="5" y1="8" x2="11" y2="8" stroke="currentColor" stroke-width="1"/><line x1="5" y1="10.5" x2="9" y2="10.5" stroke="currentColor" stroke-width="1"/>',
    words: '<circle cx="4" cy="8" r="1.5" fill="currentColor"/><circle cx="8" cy="8" r="1.5" fill="currentColor"/><circle cx="12" cy="8" r="1.5" fill="currentColor"/>',
    moon: '<path d="M13.5 8.5a5.5 5.5 0 01-7.5 5.1A6.5 6.5 0 018.5 1a5.5 5.5 0 005 7.5z" fill="currentColor"/>',
    sun: '<circle cx="8" cy="8" r="3" fill="currentColor"/><g stroke="currentColor" stroke-width="1.3" stroke-linecap="round"><line x1="8" y1="1" x2="8" y2="3"/><line x1="8" y1="13" x2="8" y2="15"/><line x1="1" y1="8" x2="3" y2="8"/><line x1="13" y1="8" x2="15" y2="8"/><line x1="3.05" y1="3.05" x2="4.46" y2="4.46"/><line x1="11.54" y1="11.54" x2="12.95" y2="12.95"/><line x1="3.05" y1="12.95" x2="4.46" y2="11.54"/><line x1="11.54" y1="4.46" x2="12.95" y2="3.05"/></g>',
    dashboard: '<rect x="1" y="1" width="5.5" height="5.5" rx="1" fill="currentColor" opacity="0.7"/><rect x="8.5" y="1" width="5.5" height="3" rx="1" fill="currentColor"/><rect x="1" y="8.5" width="5.5" height="5.5" rx="1" fill="currentColor"/><rect x="8.5" y="6" width="5.5" height="8" rx="1" fill="currentColor" opacity="0.7"/>',
    close: '<line x1="3" y1="3" x2="13" y2="13" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><line x1="13" y1="3" x2="3" y2="13" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>',
  };

  function svgIcon(name, cls) {
    return '<svg class="' + (cls || '') + '" viewBox="0 0 16 16" xmlns="http://www.w3.org/2000/svg">' + ICONS[name] + '</svg>';
  }

  // ============================================================
  // STATE
  // ============================================================
  let treeData = [];
  let currentPath = null;
  let currentDoc = null;
  let editMode = false;
  let originalContent = '';
  let dashboardCache = null;
  let isDashboardView = true;
  let glossaryTerms = null; // loaded once from /api/glossary

  // Navigation history
  const navHistory = [];  // [{path, title}]
  let navHistoryIdx = -1;
  let navIsHistoryNav = false; // prevent recording during back/forward

  // ============================================================
  // DOM REFS
  // ============================================================
  const $sidebar = document.getElementById('sidebar');
  const $sidebarTree = document.getElementById('sidebar-tree');
  const $sidebarOverlay = document.getElementById('sidebar-overlay');
  const $hamburger = document.getElementById('hamburger');
  const $searchInput = document.getElementById('search-input');
  const $searchResults = document.getElementById('search-results');
  const $toolbar = document.getElementById('doc-toolbar');
  const $breadcrumb = document.getElementById('breadcrumb');
  const $toolbarActions = document.getElementById('toolbar-actions');
  const $contentBody = document.getElementById('content-body');
  const $toast = document.getElementById('toast');
  const $themeIcon = document.getElementById('theme-icon');
  const $themeLabel = document.getElementById('theme-label');
  const $navActions = document.getElementById('sidebar-nav-actions');

  // ============================================================
  // THEME
  // ============================================================
  const savedTheme = localStorage.getItem('dr-theme') || 'dark';
  document.documentElement.setAttribute('data-theme', savedTheme);
  updateThemeUI(savedTheme);

  document.getElementById('theme-toggle').addEventListener('click', () => {
    const cur = document.documentElement.getAttribute('data-theme');
    const next = cur === 'dark' ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', next);
    localStorage.setItem('dr-theme', next);
    updateThemeUI(next);
  });

  function updateThemeUI(t) {
    $themeIcon.innerHTML = t === 'dark' ? ICONS.moon : ICONS.sun;
    $themeLabel.textContent = t === 'dark' ? 'Dark' : 'Light';
  }

  // ============================================================
  // TOAST
  // ============================================================
  function showToast(msg, type) {
    $toast.textContent = msg;
    $toast.className = 'toast toast-' + (type || 'success') + ' visible';
    clearTimeout($toast._t);
    $toast._t = setTimeout(() => {
      $toast.className = 'toast toast-' + (type || 'success');
    }, 2200);
  }

  // ============================================================
  // API
  // ============================================================
  async function apiGet(path) {
    const resp = await fetch('/api/' + path);
    if (!resp.ok) throw new Error(resp.status + ' ' + resp.statusText);
    return resp.json();
  }

  async function apiPut(path, data) {
    const resp = await fetch('/api/' + path, {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(data),
    });
    if (!resp.ok) throw new Error(resp.status + ' ' + resp.statusText);
    return resp.json();
  }

  // ============================================================
  // MOBILE SIDEBAR
  // ============================================================
  let touchStartX = 0;
  let touchCurrentX = 0;
  let sidebarOpen = false;

  function openSidebar() {
    sidebarOpen = true;
    $sidebar.classList.add('open');
    $sidebarOverlay.classList.add('visible');
  }
  function closeSidebar() {
    sidebarOpen = false;
    $sidebar.classList.remove('open');
    $sidebarOverlay.classList.remove('visible');
  }

  $hamburger.addEventListener('click', () => {
    if (sidebarOpen) closeSidebar();
    else openSidebar();
  });
  $sidebarOverlay.addEventListener('click', closeSidebar);

  // Swipe to close
  document.addEventListener('touchstart', (e) => {
    touchStartX = e.touches[0].clientX;
  }, { passive: true });
  document.addEventListener('touchmove', (e) => {
    touchCurrentX = e.touches[0].clientX;
  }, { passive: true });
  document.addEventListener('touchend', () => {
    const diff = touchStartX - touchCurrentX;
    // Swipe left on sidebar to close
    if (sidebarOpen && diff > 60 && touchStartX < 320) {
      closeSidebar();
    }
    // Swipe right from edge to open
    if (!sidebarOpen && diff < -80 && touchStartX < 30) {
      openSidebar();
    }
    touchStartX = 0;
    touchCurrentX = 0;
  });

  // ============================================================
  // SEARCH (debounced)
  // ============================================================
  let searchTimeout = null;

  $searchInput.addEventListener('input', () => {
    clearTimeout(searchTimeout);
    const q = $searchInput.value.trim();
    if (q.length < 2) {
      hideSearchResults();
      return;
    }
    searchTimeout = setTimeout(() => performSearch(q), 300);
  });

  $searchInput.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') {
      $searchInput.value = '';
      hideSearchResults();
      $searchInput.blur();
    }
  });

  // Close search results when clicking outside
  document.addEventListener('click', (e) => {
    if (!e.target.closest('.sidebar-search')) {
      hideSearchResults();
    }
  });

  async function performSearch(query) {
    try {
      const results = await apiGet('search?q=' + encodeURIComponent(query));
      renderSearchResults(results, query);
    } catch (err) {
      $searchResults.innerHTML = '';
      const div = document.createElement('div');
      div.className = 'search-no-results';
      div.textContent = 'Search error';
      $searchResults.appendChild(div);
      $searchResults.classList.add('visible');
    }
  }

  function renderSearchResults(results, query) {
    $searchResults.innerHTML = '';
    if (results.length === 0) {
      const div = document.createElement('div');
      div.className = 'search-no-results';
      div.textContent = 'No results found';
      $searchResults.appendChild(div);
      $searchResults.classList.add('visible');
      return;
    }
    const frag = document.createDocumentFragment();
    for (const r of results.slice(0, 15)) {
      const item = document.createElement('div');
      item.className = 'search-result-item';
      const isCode = r.path.startsWith('code://');
      if (!isCode) {
        item.addEventListener('click', () => {
          const searchQuery = $searchInput.value.trim();
          hideSearchResults();
          $searchInput.value = '';
          navigateTo(r.path, searchQuery);
          closeSidebar();
        });
      } else {
        item.style.opacity = '0.7';
        item.style.cursor = 'default';
      }

      const nameEl = document.createElement('div');
      nameEl.className = 'search-result-name';
      if (isCode) {
        const codeBadge = document.createElement('span');
        codeBadge.style.cssText = 'font-size:9px;padding:1px 4px;background:var(--bg-hover);border-radius:3px;margin-right:4px;color:var(--mono);text-transform:uppercase;font-weight:700;letter-spacing:0.5px';
        codeBadge.textContent = 'code';
        nameEl.appendChild(codeBadge);
        nameEl.appendChild(document.createTextNode(r.name));
      } else {
        nameEl.textContent = r.name;
      }
      item.appendChild(nameEl);

      const pathEl = document.createElement('div');
      pathEl.className = 'search-result-path';
      pathEl.textContent = isCode ? r.path.replace('code://', '') : (r.path === '__CLAUDE_MD__' ? 'CLAUDE.md' : r.path);
      item.appendChild(pathEl);

      if (r.matches && r.matches.length > 0) {
        const matchEl = document.createElement('div');
        matchEl.className = 'search-result-match';
        // Highlight query in match text safely
        const matchText = r.matches.slice(0, 2).join(' ... ');
        matchEl.innerHTML = highlightQuery(matchText, query);
        item.appendChild(matchEl);
      }
      frag.appendChild(item);
    }
    $searchResults.appendChild(frag);
    $searchResults.classList.add('visible');
  }

  function highlightQuery(text, query) {
    // Escape HTML entities first, then wrap matches
    const escaped = text.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    const re = new RegExp('(' + escapeRegex(query) + ')', 'gi');
    return escaped.replace(re, '<mark>$1</mark>');
  }

  function escapeRegex(s) {
    return s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  }

  function hideSearchResults() {
    $searchResults.classList.remove('visible');
  }

  // ============================================================
  // FILE TREE
  // ============================================================
  const expandedFolders = new Set(JSON.parse(localStorage.getItem('dr-expanded') || '[]'));

  async function loadTree() {
    try {
      treeData = await apiGet('tree');
      renderTree(treeData);
    } catch (err) {
      $sidebarTree.innerHTML = '';
      const errDiv = document.createElement('div');
      errDiv.style.cssText = 'padding: 16px; color: var(--danger); font-size: 0.82rem;';
      errDiv.textContent = 'Failed to load document tree';
      $sidebarTree.appendChild(errDiv);
    }
  }

  function renderTree(entries) {
    $sidebarTree.innerHTML = '';
    const frag = document.createDocumentFragment();
    for (const entry of entries) {
      frag.appendChild(buildTreeNode(entry));
    }
    $sidebarTree.appendChild(frag);
    updateActiveFile();
  }

  function buildTreeNode(entry) {
    if (entry.type === 'directory') {
      const wrapper = document.createElement('div');
      wrapper.className = 'tree-node';

      const btn = document.createElement('button');
      btn.className = 'tree-folder';
      btn.setAttribute('aria-label', 'Folder: ' + entry.name);

      const isOpen = expandedFolders.has(entry.path);

      btn.innerHTML =
        '<svg class="tree-chevron' + (isOpen ? ' open' : '') + '" viewBox="0 0 16 16" xmlns="http://www.w3.org/2000/svg">' + ICONS.chevron + '</svg>' +
        svgIcon('folder', 'tree-icon') +
        '<span class="tree-folder-name">' + escapeHTML(entry.name) + '</span>';

      const children = document.createElement('div');
      children.className = 'tree-children' + (isOpen ? '' : ' collapsed');
      if (entry.children) {
        for (const child of entry.children) {
          children.appendChild(buildTreeNode(child));
        }
      }

      btn.addEventListener('click', () => {
        const chevron = btn.querySelector('.tree-chevron');
        const isNowOpen = children.classList.toggle('collapsed');
        if (isNowOpen) {
          chevron.classList.remove('open');
          expandedFolders.delete(entry.path);
        } else {
          chevron.classList.add('open');
          expandedFolders.add(entry.path);
        }
        saveExpandedState();
      });

      wrapper.appendChild(btn);
      wrapper.appendChild(children);
      return wrapper;
    }

    // File node
    const btn = document.createElement('button');
    btn.className = 'tree-file';
    btn.setAttribute('data-path', entry.path);
    btn.setAttribute('aria-label', 'Document: ' + entry.name);
    btn.innerHTML =
      svgIcon('file', 'tree-icon') +
      '<span class="tree-file-name">' + escapeHTML(entry.name) + '</span>';

    btn.addEventListener('click', () => {
      navigateTo(entry.path);
      closeSidebar();
    });

    return btn;
  }

  function saveExpandedState() {
    localStorage.setItem('dr-expanded', JSON.stringify([...expandedFolders]));
  }

  function updateActiveFile() {
    const files = $sidebarTree.querySelectorAll('.tree-file');
    for (const f of files) {
      f.classList.toggle('active', f.getAttribute('data-path') === currentPath);
    }
  }

  function escapeHTML(str) {
    const map = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' };
    return str.replace(/[&<>"]/g, c => map[c]);
  }

  // ============================================================
  // NAVIGATION
  // ============================================================
  async function navigateTo(path, highlightTerm) {
    if (editMode) {
      if (!confirm('Discard unsaved changes?')) return;
      editMode = false;
    }

    isDashboardView = false;
    currentPath = path;
    localStorage.setItem('dr-last-doc', path);

    // Record in navigation history (unless navigating via back/forward)
    if (!navIsHistoryNav) {
      // Trim forward history if we navigated from middle
      if (navHistoryIdx < navHistory.length - 1) navHistory.length = navHistoryIdx + 1;
      const title = path === '__CLAUDE_MD__' ? 'CLAUDE' : path.split('/').pop()?.replace('.md', '') || path;
      navHistory.push({ path, title });
      if (navHistory.length > 10) navHistory.shift();
      navHistoryIdx = navHistory.length - 1;
      renderHistoryBar();
    }
    navIsHistoryNav = false;
    updateActiveFile();
    // Deactivate dashboard button
    const dashBtn = document.getElementById('dash-btn');
    if (dashBtn) dashBtn.classList.remove('active');
    showLoading();
    $toolbar.style.display = 'flex';

    try {
      const doc = await apiGet('doc?path=' + encodeURIComponent(path));
      currentDoc = doc;
      renderDocument(doc);
      // Scroll to and highlight a term if requested
      if (highlightTerm) {
        requestAnimationFrame(() => {
          const mdContent = $contentBody.querySelector('.md-content');
          if (!mdContent) return;
          // Find text containing the term
          const walker = document.createTreeWalker(mdContent, NodeFilter.SHOW_TEXT);
          let found = null;
          while (walker.nextNode()) {
            if (walker.currentNode.textContent.includes(highlightTerm)) {
              found = walker.currentNode.parentElement;
              break;
            }
          }
          if (found) {
            found.scrollIntoView({ behavior: 'smooth', block: 'center' });
            found.classList.add('glossary-highlight-flash');
            setTimeout(() => found.classList.remove('glossary-highlight-flash'), 4000);
          }
        });
      }
    } catch (err) {
      showError('Failed to load document', err.message);
    }
  }

  // ─── History bar ───
  const $historyBar = document.getElementById('history-bar');
  const $historyBack = document.getElementById('history-back');
  const $historyForward = document.getElementById('history-forward');
  const $historyList = document.getElementById('history-list');

  function renderHistoryBar() {
    $historyBack.disabled = navHistoryIdx <= 0;
    $historyForward.disabled = navHistoryIdx >= navHistory.length - 1;
    $historyList.innerHTML = '';
    // Show last 10 entries
    const start = Math.max(0, navHistory.length - 10);
    for (let i = start; i < navHistory.length; i++) {
      const entry = navHistory[i];
      const el = document.createElement('button');
      el.className = 'history-item' + (i === navHistoryIdx ? ' active' : '');
      el.textContent = entry.title;
      el.title = entry.path;
      el.addEventListener('click', () => {
        navHistoryIdx = i;
        navIsHistoryNav = true;
        navigateTo(entry.path);
        renderHistoryBar();
      });
      $historyList.appendChild(el);
    }
  }

  $historyBack.addEventListener('click', () => {
    if (navHistoryIdx > 0) {
      navHistoryIdx--;
      navIsHistoryNav = true;
      navigateTo(navHistory[navHistoryIdx].path);
      renderHistoryBar();
    }
  });

  $historyForward.addEventListener('click', () => {
    if (navHistoryIdx < navHistory.length - 1) {
      navHistoryIdx++;
      navIsHistoryNav = true;
      navigateTo(navHistory[navHistoryIdx].path);
      renderHistoryBar();
    }
  });

  // Keyboard: Alt+Left/Right for back/forward
  document.addEventListener('keydown', (e) => {
    if (e.altKey && e.key === 'ArrowLeft') { e.preventDefault(); $historyBack.click(); }
    if (e.altKey && e.key === 'ArrowRight') { e.preventDefault(); $historyForward.click(); }
  });

  // ─── Internal link navigation ───
  // Resolve relative .md paths against current document's directory
  function resolveDocPath(href) {
    const clean = href.split('#')[0]; // strip anchor
    if (!clean) return '';

    // Special case: CLAUDE.md at project root
    const basename = clean.split('/').pop();
    if (basename === 'CLAUDE.md') return '__CLAUDE_MD__';

    if (!currentPath || currentPath === '__CLAUDE_MD__') return clean;
    const dir = currentPath.includes('/') ? currentPath.substring(0, currentPath.lastIndexOf('/')) : '';

    // Absolute from docs root
    if (clean.startsWith('/')) return clean.substring(1);

    // Relative: resolve ../ against current directory
    const parts = (dir ? dir + '/' + clean : clean).split('/');
    const resolved = [];
    for (const p of parts) {
      if (p === '..') { if (resolved.length) resolved.pop(); }
      else if (p !== '.') resolved.push(p);
    }
    return resolved.join('/');
  }

  $contentBody.addEventListener('click', (e) => {
    const link = e.target.closest('a[data-doc-link]');
    if (!link) return;
    e.preventDefault();
    const href = link.getAttribute('href');
    if (!href) return;
    const docPath = resolveDocPath(href);
    if (docPath) navigateTo(docPath);
  });

  function showLoading() {
    $contentBody.innerHTML = '';
    $toolbarActions.innerHTML = '';
    $breadcrumb.innerHTML = '';
    const loading = document.createElement('div');
    loading.className = 'loading';
    loading.innerHTML = '<div class="loading-spinner"></div> Loading...';
    $contentBody.appendChild(loading);
  }

  function showError(title, detail) {
    $contentBody.innerHTML = '';
    const err = document.createElement('div');
    err.className = 'error-state';

    const msg = document.createElement('div');

  function renderBreadcrumb(path) {
    $breadcrumb.innerHTML = '';
    const parts = path === '__CLAUDE_MD__' ? ['CLAUDE.md'] : path.split('/');

    // "docs" root
    const root = document.createElement('span');
    root.className = 'breadcrumb-item';

  function extractTitle(content, fallbackName) {
    const match = content.match(/^#\s+(.+)$/m);
    if (match) return match[1].replace(/[*_`]/g, '');
    return fallbackName || 'Untitled';
  }

  function countWords(text) {
    return text.replace(/```[\s\S]*?```/g, '').replace(/[#*_`>\-|=\[\]()]/g, ' ').split(/\s+/).filter(w => w.length > 0).length;
  }

  function formatDate(iso) {
    try {
      const d = new Date(iso);
      return d.toLocaleDateString('ru-RU', { day: 'numeric', month: 'short', year: 'numeric' }) +
        ', ' + d.toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' });
    } catch { return iso; }
  }

  function formatSize(bytes) {
    if (bytes < 1024) return bytes + ' B';
    if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
    return (bytes / (1024 * 1024)).toFixed(1) + ' MB';
  }

  // ============================================================
  // MARKDOWN RENDERING (marked.use API for v13+)
  // ============================================================
  if (typeof marked !== 'undefined') {
    marked.use({
      gfm: true,
      breaks: false,
      renderer: {
        table({ header, rows, align }) {
          let h = '<tr>';
          for (let i = 0; i < header.length; i++) {
            const a = align[i] ? ' style="text-align:' + align[i] + '"' : '';
            h += '<th' + a + '>' + this.parser.parseInline(header[i].tokens) + '</th>';
          }
          h += '</tr>';
          let b = '';
          for (const row of rows) {
            b += '<tr>';
            for (let i = 0; i < row.length; i++) {
              const a = align[i] ? ' style="text-align:' + align[i] + '"' : '';
              b += '<td' + a + '>' + this.parser.parseInline(row[i].tokens) + '</td>';
            }
            b += '</tr>';
          }
          return '<div class="table-wrap"><table><thead>' + h + '</thead><tbody>' + b + '</tbody></table></div>';
        },
        link({ href, title, tokens }) {
          const text = this.parser.parseInline(tokens);
          const t = title ? ' title="' + escapeHTML(title) + '"' : '';
          if (href && (href.startsWith('http://') || href.startsWith('https://'))) {
            return '<a href="' + escapeHTML(href) + '"' + t + ' target="_blank" rel="noopener noreferrer">' + text + '</a>';
          }
          // Internal .md links — mark for SPA navigation
          if (href && (href.endsWith('.md') || href.includes('.md#'))) {
            return '<a href="' + escapeHTML(href) + '"' + t + ' data-doc-link>' + text + '</a>';
          }
          return '<a href="' + escapeHTML(href || '') + '"' + t + '>' + text + '</a>';
        },
      },
    });
  }

  function renderMarkdown(src) {
    if (typeof marked === 'undefined') {
      return '<pre><code>' + escapeHTML(src) + '</code></pre>';
    }
    try {
      let html = marked.parse(src);
      // Post-process: blockquotes with **Key**: value lines → structured metadata card
      html = html.replace(/<blockquote>([\s\S]*?)<\/blockquote>/g, (match, inner) => {
        // Check if content has metadata-like pattern: **Word**: value
        const metaPattern = /<strong>([^<]+)<\/strong>\s*:\s*/g;
        const metaCount = (inner.match(metaPattern) || []).length;
        if (metaCount >= 2) {
          // Split on <strong>Key</strong>: pattern, rebuild as table
          const items = [];
          const re = /<strong>([^<]+)<\/strong>\s*:\s*([\s\S]*?)(?=<strong>|$)/g;
          let m;
          while ((m = re.exec(inner)) !== null) {
            const key = m[1].trim();
            let val = m[2].trim().replace(/<\/?p>/g, '').replace(/\n/g, ' ').trim();
            if (val.endsWith('<br>')) val = val.slice(0, -4);
            items.push('<div class="spec-meta-row"><span class="spec-meta-key">' + key + '</span><span class="spec-meta-val">' + val + '</span></div>');
          }
          if (items.length > 0) {
            return '<div class="spec-meta-card">' + items.join('') + '</div>';
          }
        }
        return match; // Not metadata, keep as blockquote
      });
      return html;
    } catch (e) {
      console.error('[Markdown]', e);
      return '<pre><code>' + escapeHTML(src) + '</code></pre>';
    }
  }

  // ─── Glossary: DOM-based auto-linking ───

  async function loadGlossary() {
    if (glossaryTerms) return;
    try {
      const data = await apiGet('glossary');
      glossaryTerms = data.terms || [];
    } catch { glossaryTerms = []; }
  }
  loadGlossary();

  const SKIP_TAGS = new Set(['CODE', 'PRE', 'A', 'H1', 'H2', 'H3', 'H4', 'H5', 'H6', 'SPAN']);

  function applyGlossaryToDOM(container) {
    if (!glossaryTerms || glossaryTerms.length === 0) return;

    // Collect all text nodes first (avoid mutation during walk)
    const textNodes = [];
    function collectText(node) {
      if (node.nodeType === Node.ELEMENT_NODE) {
        if (SKIP_TAGS.has(node.tagName)) return;
        if (node.classList?.contains('spec-meta-card')) return;
        for (const child of Array.from(node.childNodes)) collectText(child);
      } else if (node.nodeType === Node.TEXT_NODE && node.textContent.trim().length >= 2) {
        textNodes.push(node);
      }
    }
    collectText(container);

    // Process each text node — find ALL matching terms, replace all occurrences
    for (const node of textNodes) {
      let text = node.textContent;
      // Find first matching term in this text node
      let bestMatch = null;
      for (const entry of glossaryTerms) {
        const escaped = entry.term.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
        const re = new RegExp('\\b(' + escaped + ')\\b', entry.term.length <= 3 ? '' : 'i');
        const match = text.match(re);
        if (match && match.index != null) {
          if (!bestMatch || match.index < bestMatch.index) {
            bestMatch = { entry, match, index: match.index };
          }
        }
      }
      if (!bestMatch) continue;

      // Split: before | matched | after — then recurse on "after"
      const { entry, match } = bestMatch;
      const before = text.substring(0, match.index);
      const matched = match[1];
      const after = text.substring(match.index + matched.length);
      const span = document.createElement('span');
      span.className = 'glossary-term glossary-tier-' + entry.tier;
      span.textContent = matched;
      span.dataset.glossaryDoc = entry.doc;
      span.dataset.glossaryDesc = entry.description;
      span.dataset.glossaryTerm = entry.term;
      const parent = node.parentNode;
      if (before) parent.insertBefore(document.createTextNode(before), node);
      parent.insertBefore(span, node);
      if (after) {
        const afterNode = document.createTextNode(after);
        parent.insertBefore(afterNode, node);
        // Queue afterNode for further processing (remaining terms in same text)
        textNodes.push(afterNode);
      }
      parent.removeChild(node);
    }
  }

  // Custom tooltip popup
  const $tooltip = document.createElement('div');

  // ============================================================

  // ============================================================
  function enterEditMode() {
    if (!currentDoc) return;
    editMode = true;
    originalContent = currentDoc.content;

    // Update toolbar
    $toolbarActions.innerHTML = '';

    const saveBtn = document.createElement('button');
    saveBtn.className = 'btn btn-success';
    saveBtn.innerHTML = svgIcon('save', 'btn-icon') + ' Save <span class="kbd">Ctrl+S</span>';
    saveBtn.addEventListener('click', saveDocument);
    $toolbarActions.appendChild(saveBtn);

    const cancelBtn = document.createElement('button');
    cancelBtn.className = 'btn btn-ghost';
    cancelBtn.innerHTML = svgIcon('cancel', 'btn-icon') + ' Cancel <span class="kbd">Esc</span>';
    cancelBtn.addEventListener('click', exitEditMode);
    $toolbarActions.appendChild(cancelBtn);

    // Replace content with textarea
    $contentBody.innerHTML = '';
    const editArea = document.createElement('div');
    editArea.className = 'edit-area';

    const textarea = document.createElement('textarea');
    textarea.className = 'edit-textarea';
    textarea.id = 'edit-textarea';
    textarea.value = currentDoc.content;
    textarea.spellcheck = false;

    // Handle Tab key for indentation
    textarea.addEventListener('keydown', (e) => {
      if (e.key === 'Tab') {
        e.preventDefault();
        const start = textarea.selectionStart;
        const end = textarea.selectionEnd;
        textarea.value = textarea.value.substring(0, start) + '  ' + textarea.value.substring(end);
        textarea.selectionStart = textarea.selectionEnd = start + 2;
      }
    });

    editArea.appendChild(textarea);
    $contentBody.appendChild(editArea);
    textarea.focus();
  }

  function exitEditMode() {
    if (!currentDoc) return;
    editMode = false;
    renderDocument(currentDoc);
  }

  async function saveDocument() {
    const textarea = document.getElementById('edit-textarea');
    if (!textarea || !currentDoc) return;

    const content = textarea.value;
    try {
      await apiPut('doc?path=' + encodeURIComponent(currentDoc.path), { content });
      currentDoc.content = content;
      showToast('Saved');
      exitEditMode();
    } catch (err) {
      showToast('Save failed: ' + err.message, 'error');
    }
  }

  // ============================================================
  document.addEventListener('keydown', (e) => {
    // Ctrl+S — save in edit mode
    if ((e.ctrlKey || e.metaKey) && e.key === 's') {
      e.preventDefault();
      if (editMode) saveDocument();
    }
    // Escape — cancel edit mode
    if (e.key === 'Escape' && editMode) {
      exitEditMode();
    }
    // Ctrl+K or / — focus search (when not editing)
    if (((e.ctrlKey || e.metaKey) && e.key === 'k') || (e.key === '/' && !editMode && document.activeElement.tagName !== 'INPUT' && document.activeElement.tagName !== 'TEXTAREA')) {
      e.preventDefault();

  function normalizeStatus(raw) {
    if (!raw) return 'spec';
    const s = raw.toLowerCase().trim();
    if (s.includes('implemented') || s.includes('done') || s.includes('complete') || s.includes('verified') || s.includes('validated') || s.includes('superseded') || s.includes('реализовано') || s.includes('near-complete')) return 'done';
    if (s.includes('progress') || s.includes('partial')) return 'in-progress';
    if (s.includes('deferred')) return 'deferred';

  function createPulseCard(title, contentBuilder) {
    const card = document.createElement('div');
    card.className = 'dash-pulse-card';
    const header = document.createElement('div');
    header.className = 'dash-card-header';
    header.textContent = title;
    card.appendChild(header);
    const body = document.createElement('div');
    body.className = 'dash-card-body';
    body.appendChild(contentBuilder());
    card.appendChild(body);
    return card;
  }

  function createDonutChart(done, total, size) {
    const pct = total > 0 ? done / total : 0;
    const r = (size - 10) / 2;
    const cx = size / 2;
    const cy = size / 2;
    const circumference = 2 * Math.PI * r;
    const offset = circumference * (1 - pct);

    const ns = 'http://www.w3.org/2000/svg';
    const svg = document.createElementNS(ns, 'svg');
    svg.setAttribute('width', String(size));
    svg.setAttribute('height', String(size));
    svg.setAttribute('viewBox', '0 0 ' + size + ' ' + size);
    svg.classList.add('dash-donut-svg');

    // Background ring
    const bgCircle = document.createElementNS(ns, 'circle');
    bgCircle.setAttribute('cx', String(cx));
    bgCircle.setAttribute('cy', String(cy));
    bgCircle.setAttribute('r', String(r));
    bgCircle.setAttribute('fill', 'none');
    bgCircle.setAttribute('stroke', 'var(--border)');
    bgCircle.setAttribute('stroke-width', '6');
    svg.appendChild(bgCircle);

    // Progress ring
    const fgCircle = document.createElementNS(ns, 'circle');
    fgCircle.setAttribute('cx', String(cx));
    fgCircle.setAttribute('cy', String(cy));
    fgCircle.setAttribute('r', String(r));
    fgCircle.setAttribute('fill', 'none');
    fgCircle.setAttribute('stroke', 'var(--success)');
    fgCircle.setAttribute('stroke-width', '6');
    fgCircle.setAttribute('stroke-linecap', 'round');
    fgCircle.setAttribute('stroke-dasharray', String(circumference));
    fgCircle.setAttribute('stroke-dashoffset', String(offset));
    fgCircle.setAttribute('transform', 'rotate(-90 ' + cx + ' ' + cy + ')');
    fgCircle.classList.add('dash-donut-progress');
    svg.appendChild(fgCircle);

    // Center text
    const text = document.createElementNS(ns, 'text');
    text.setAttribute('x', String(cx));
    text.setAttribute('y', String(cy));
    text.setAttribute('text-anchor', 'middle');
    text.setAttribute('dominant-baseline', 'central');
    text.setAttribute('fill', 'var(--text)');
    text.setAttribute('font-size', '16');
    text.setAttribute('font-weight', '700');
    text.setAttribute('font-family', 'var(--font)');
    text.textContent = Math.round(pct * 100) + '%';
    svg.appendChild(text);

    return svg;
  }

  // ─── Section 2: Milestone Timeline ───

  function buildMilestoneTimeline(roadmap) {
    const section = document.createElement('section');

  // ─── Section 3: Spec Flow ───

  function buildSpecFlow(specsData) {
    const section = document.createElement('section');
    section.className = 'dash-section';
    const heading = document.createElement('h2');
    heading.className = 'dash-section-title';
    heading.textContent = 'Spec Flow';
    section.appendChild(heading);

    // Group by milestone — all mapping done server-side, frontend just normalizes
    function normalizeMilestone(raw) {
      if (!raw) return null;
      const m = raw.match(/^(M\d+\.?\d?|P\d)/);
      return m ? m[1] : raw;
    }

    const groups = {};
    for (const spec of specsData.specs) {
      const ms = normalizeMilestone(spec.milestone) || 'Other';
      if (!groups[ms]) groups[ms] = [];
      groups[ms].push(spec);
    }

    // Sort milestones naturally: M1 < M2 < M2.5 < M3 ... then non-M groups alphabetically, Other last
    const milestoneOrder = Object.keys(groups).sort((a, b) => {
      const aM = a.match(/^M(\d+\.?\d*)/), bM = b.match(/^M(\d+\.?\d*)/);
      if (aM && bM) return parseFloat(aM[1]) - parseFloat(bM[1]);
      if (aM) return -1;
      if (bM) return 1;
      if (a === 'Other') return 1;
      if (b === 'Other') return -1;
      return a.localeCompare(b);
    });
    for (const ms of milestoneOrder) {
      if (!groups[ms] || groups[ms].length === 0) continue;

      const group = document.createElement('div');
      group.className = 'dash-spec-group';

      const specs_in_group = groups[ms];
      const doneCount = specs_in_group.filter(s => normalizeStatus(s.status) === 'done').length;

      const groupHeader = document.createElement('div');
      groupHeader.className = 'dash-spec-group-header';

      const groupLabel = document.createElement('span');
      groupLabel.className = 'dash-spec-group-label';
      groupLabel.textContent = ms;
      groupHeader.appendChild(groupLabel);

      const groupCounter = document.createElement('span');
      groupCounter.className = 'dash-spec-group-counter';
      groupCounter.textContent = doneCount + '/' + specs_in_group.length;
      if (doneCount === specs_in_group.length) groupCounter.classList.add('complete');
      groupHeader.appendChild(groupCounter);

      group.appendChild(groupHeader);

      const grid = document.createElement('div');
      grid.className = 'dash-spec-grid';

      for (const spec of groups[ms]) {
        const card = document.createElement('button');
        card.className = 'dash-spec-card';
        const specPath = 'specs/' + spec.name + '.md';
        card.addEventListener('click', () => navigateTo(specPath));

        const nameEl = document.createElement('span');
        nameEl.className = 'dash-spec-name';
        const displayName = (spec.title || spec.name).replace('SPEC-', '').replace('AUDIT-', '').replace(/-/g, ' ');
        nameEl.textContent = displayName;
        card.appendChild(nameEl);

        const status = normalizeStatus(spec.status);
        const badge = document.createElement('span');
        badge.className = 'dash-spec-badge';
        badge.style.setProperty('--badge-color', STATUS_COLORS[status] || 'var(--text-muted)');
        badge.textContent = STATUS_LABELS[status] || spec.status || 'Spec';
        card.appendChild(badge);

        grid.appendChild(card);
      }

      group.appendChild(grid);
      section.appendChild(group);
    }

    return section;
  }

  // ─── Section 4: Tension Timeline ───

  // Derive escalation steps dynamically from cached affordance data
  function getEscalationSteps() {
    if (!dashboardCache?.affordances?.affordances) return [];
    return dashboardCache.affordances.affordances
      .filter(a => a.category === 'crime' && a.threshold)
      .map(a => {
        const confMatch = a.threshold.match(/conf >= ([\d.]+)/);
        const moodMatch = a.threshold.match(/mood <= ([\-\d.]+)/);
        const val = confMatch ? parseFloat(confMatch[1]) : (moodMatch ? Math.abs(parseFloat(moodMatch[1])) : null);
        return val != null ? { label: a.id, conf: val } : null;
      })
      .filter(Boolean)
      .sort((a, b) => a.conf - b.conf);
  }

  function buildTensionTimeline(world) {
    const section = document.createElement('section');
    section.className = 'dash-section';
    const heading = document.createElement('h2');
    heading.className = 'dash-section-title';
    heading.textContent = 'Tension Map';
    section.appendChild(heading);

    if (!world.motives || world.motives.length === 0) {
      const empty = document.createElement('div');
      empty.className = 'dash-pulse-empty';
      empty.textContent = 'No active motives';
      section.appendChild(empty);
      return section;
    }

    const npcMap = {};
    for (const n of world.npcs) npcMap[n.id] = n;

    const container = document.createElement('div');
    container.className = 'dash-tension-list';

    for (const m of world.motives) {
      const fromNpc = npcMap[m.from];
      const toNpc = npcMap[m.to];
      if (!fromNpc || !toNpc) continue;

      const row = document.createElement('div');
      row.className = 'dash-tension-row';

      // Names
      const names = document.createElement('div');
      names.className = 'dash-tension-names';
      names.innerHTML = '<span class="tension-from">' + escapeHTML(fromNpc.name) + '</span>'
        + '<span class="tension-arrow">&#8594;</span>'
        + '<span class="tension-to">' + escapeHTML(toNpc.name) + '</span>';
      row.appendChild(names);

      // Type badge
      const typeBadge = document.createElement('span');
      typeBadge.className = 'dash-tension-type';
      typeBadge.style.color = MOTIVE_COLORS[m.type] || 'var(--text-muted)';
      // Auto-label from type name: REVENGE_DESIRE → Revenge Desire
      typeBadge.textContent = (m.type || '').replace(/_/g, ' ').toLowerCase().replace(/\b\w/g, c => c.toUpperCase());
      row.appendChild(typeBadge);

      // Confidence bar
      const barWrap = document.createElement('div');
      barWrap.className = 'dash-tension-bar-wrap';
      const bar = document.createElement('div');
      bar.className = 'dash-tension-bar';
      bar.style.width = Math.round(m.confidence * 100) + '%';
      bar.style.background = MOTIVE_COLORS[m.type] || 'var(--accent)';
      barWrap.appendChild(bar);

      // Escalation markers on bar
      for (const step of getEscalationSteps()) {
        const marker = document.createElement('div');
        marker.className = 'dash-tension-marker';
        marker.style.left = Math.round(step.conf * 100) + '%';
        marker.title = step.label + ' (' + step.conf + ')';
        if (m.confidence >= step.conf) marker.classList.add('passed');
        barWrap.appendChild(marker);
      }
      row.appendChild(barWrap);

      // Confidence value
      const confVal = document.createElement('span');
      confVal.className = 'dash-tension-conf';
      confVal.textContent = m.confidence.toFixed(2);
      row.appendChild(confVal);

      // Reason (truncated)
      if (m.reason) {
        const reason = document.createElement('div');
        reason.className = 'dash-tension-reason';
        reason.textContent = m.reason.length > 80 ? m.reason.substring(0, 77) + '...' : m.reason;
        row.appendChild(reason);
      }

      container.appendChild(row);
    }

    section.appendChild(container);
    return section;
  }

  // ─── Section 5: NPC Constellation ───

  function buildNpcConstellation(world) {
    const section = document.createElement('section');
    section.className = 'dash-section';
    const heading = document.createElement('h2');
    heading.className = 'dash-section-title';
    heading.textContent = 'NPC Constellation';
    section.appendChild(heading);

    const container = document.createElement('div');
    container.className = 'dash-constellation-container';

    const svgSize = 480;
    const ns = 'http://www.w3.org/2000/svg';
    const svg = document.createElementNS(ns, 'svg');
    svg.setAttribute('viewBox', '0 0 ' + svgSize + ' ' + svgSize);
    svg.classList.add('dash-constellation-svg');

    const npcs = world.npcs;
    const rels = world.relationships;
    const cx = svgSize / 2;
    const cy = svgSize / 2;
    const radius = svgSize / 2 - 60;

    // Calculate positions in a ring
    const npcPositions = {};
    npcs.forEach((npc, i) => {
      const angle = (2 * Math.PI * i / npcs.length) - Math.PI / 2;
      npcPositions[npc.id] = {
        x: cx + radius * Math.cos(angle),
        y: cy + radius * Math.sin(angle),
      };
    });

    // Draw edges
    const edgeGroup = document.createElementNS(ns, 'g');
    edgeGroup.classList.add('dash-constellation-edges');
    for (const rel of rels) {
      const from = npcPositions[rel.from];
      const to = npcPositions[rel.to];
      if (!from || !to) continue;

      const sentiment = rel.sentiment ?? 0;
      let color = 'var(--text-muted)'; // neutral
      if (sentiment > 0.1) color = 'var(--success)';
      else if (sentiment < -0.1) color = 'var(--danger)';

      const trust = rel.trust ?? 0.5;
      const width = 0.5 + trust * 2;

      const line = document.createElementNS(ns, 'line');
      line.setAttribute('x1', String(from.x));
      line.setAttribute('y1', String(from.y));
      line.setAttribute('x2', String(to.x));
      line.setAttribute('y2', String(to.y));
      line.setAttribute('stroke', color);
      line.setAttribute('stroke-width', String(width));
      line.setAttribute('stroke-opacity', '0.35');
      edgeGroup.appendChild(line);
    }
    svg.appendChild(edgeGroup);

    // Draw nodes
    const nodeGroup = document.createElementNS(ns, 'g');
    nodeGroup.classList.add('dash-constellation-nodes');
    for (const npc of npcs) {
      const pos = npcPositions[npc.id];
      const color = ROLE_COLORS[npc.role] || '#8b949e';

      const g = document.createElementNS(ns, 'g');
      g.classList.add('dash-constellation-node');
      g.setAttribute('data-npc-id', npc.id);
      g.style.cursor = 'pointer';

      // Glow effect
      const glow = document.createElementNS(ns, 'circle');
      glow.setAttribute('cx', String(pos.x));
      glow.setAttribute('cy', String(pos.y));
      glow.setAttribute('r', '22');
      glow.setAttribute('fill', color);
      glow.setAttribute('opacity', '0.12');
      g.appendChild(glow);

      // Main circle
      const circle = document.createElementNS(ns, 'circle');
      circle.setAttribute('cx', String(pos.x));
      circle.setAttribute('cy', String(pos.y));
      circle.setAttribute('r', '16');
      circle.setAttribute('fill', 'var(--bg-surface)');
      circle.setAttribute('stroke', color);
      circle.setAttribute('stroke-width', '2.5');
      g.appendChild(circle);

      // Name label
      const labelY = pos.y > cy ? pos.y + 30 : pos.y - 26;
      const text = document.createElementNS(ns, 'text');
      text.setAttribute('x', String(pos.x));
      text.setAttribute('y', String(labelY));
      text.setAttribute('text-anchor', 'middle');
      text.setAttribute('fill', 'var(--text-sec)');
      text.setAttribute('font-size', '11');
      text.setAttribute('font-family', 'var(--font)');
      text.textContent = npc.name;
      g.appendChild(text);

      // Role initial inside circle
      const initial = document.createElementNS(ns, 'text');
      initial.setAttribute('x', String(pos.x));
      initial.setAttribute('y', String(pos.y));
      initial.setAttribute('text-anchor', 'middle');
      initial.setAttribute('dominant-baseline', 'central');
      initial.setAttribute('fill', color);
      initial.setAttribute('font-size', '12');
      initial.setAttribute('font-weight', '700');
      initial.setAttribute('font-family', 'var(--font)');
      initial.textContent = npc.name.charAt(0);
      g.appendChild(initial);

      // Tooltip on hover (via title element)
      const titleEl = document.createElementNS(ns, 'title');
      const bigFive = npc.bigFive || npc.personality || {};
      titleEl.textContent = npc.name + ' (' + npc.role + ')\nO:' + (bigFive.O ?? '?') + ' C:' + (bigFive.C ?? '?') + ' E:' + (bigFive.E ?? '?') + ' A:' + (bigFive.A ?? '?') + ' N:' + (bigFive.N ?? '?') + ' H:' + (bigFive.H ?? '?');
      g.appendChild(titleEl);

      // Click handler
      g.addEventListener('click', () => {
        showNpcDossier(npc.id, world);
      });

      nodeGroup.appendChild(g);
    }
    svg.appendChild(nodeGroup);

    container.appendChild(svg);

    // Legend
    const legend = document.createElement('div');
    legend.className = 'dash-constellation-legend';
    legend.innerHTML = '<span class="legend-item"><span class="legend-line" style="background:#3fb950"></span> positive sentiment</span>'
      + '<span class="legend-item"><span class="legend-line" style="background:#f85149"></span> negative sentiment</span>'
      + '<span class="legend-item"><span class="legend-line" style="background:#6e7681"></span> neutral</span>'
      + '<span class="legend-item"><span class="legend-dot"></span> thickness = trust</span>';
    container.appendChild(legend);

    section.appendChild(container);

    // Dossier container (hidden by default)
    const dossier = document.createElement('div');
    dossier.className = 'dash-dossier';
    dossier.id = 'dash-dossier';
    dossier.style.display = 'none';
    section.appendChild(dossier);

    return section;
  }

  // ─── Section 5: NPC Dossier ───

  function showNpcDossier(npcId, world) {
    const npc = world.npcs.find(n => n.id === npcId);
    if (!npc) return;

    const dossier = document.getElementById('dash-dossier');
    if (!dossier) return;
    dossier.style.display = 'block';
    dossier.innerHTML = '';

    // Close button
    const closeBtn = document.createElement('button');
    closeBtn.className = 'dash-dossier-close';
    closeBtn.setAttribute('aria-label', 'Close dossier');
    closeBtn.innerHTML = svgIcon('close', 'dash-dossier-close-icon');
    closeBtn.addEventListener('click', () => {
      dossier.style.display = 'none';
    });
    dossier.appendChild(closeBtn);

    // Header: Name + Role badge
    const header = document.createElement('div');
    header.className = 'dash-dossier-header';
    const nameEl = document.createElement('h3');
    nameEl.className = 'dash-dossier-name';
    nameEl.textContent = npc.name;
    header.appendChild(nameEl);
    const roleBadge = document.createElement('span');
    roleBadge.className = 'dash-dossier-role';
    roleBadge.style.setProperty('--role-color', ROLE_COLORS[npc.role] || '#8b949e');
    roleBadge.textContent = npc.role;
    header.appendChild(roleBadge);
    dossier.appendChild(header);

    // Two columns layout
    const cols = document.createElement('div');
    cols.className = 'dash-dossier-cols';

    // Left: Radar chart + Enneagram
    const left = document.createElement('div');
    left.className = 'dash-dossier-col';

    const radarTitle = document.createElement('div');
    radarTitle.className = 'dash-dossier-subtitle';
    radarTitle.textContent = 'Big Five + Honesty';
    left.appendChild(radarTitle);
    left.appendChild(createRadarChart(npc.bigFive || npc.personality || {}, 160));

    if (npc.enneagram) {
      const ennTitle = document.createElement('div');
      ennTitle.className = 'dash-dossier-subtitle';
      ennTitle.textContent = 'Enneagram';
      left.appendChild(ennTitle);

      const ennType = document.createElement('div');
      ennType.className = 'dash-dossier-enn-type';
      ennType.textContent = 'Type ' + npc.enneagram.type + 'w' + npc.enneagram.wing;
      left.appendChild(ennType);

      const ennFear = document.createElement('div');
      ennFear.className = 'dash-dossier-enn-detail';
      const fearLabel = document.createElement('span');
      fearLabel.className = 'dash-dossier-enn-label';
      fearLabel.textContent = 'Fear: ';
      ennFear.appendChild(fearLabel);
      const fearText = document.createElement('span');
      fearText.textContent = npc.enneagram.coreFear;
      ennFear.appendChild(fearText);
      left.appendChild(ennFear);

      const ennDesire = document.createElement('div');
      ennDesire.className = 'dash-dossier-enn-detail';
      const desireLabel = document.createElement('span');
      desireLabel.className = 'dash-dossier-enn-label';
      desireLabel.textContent = 'Desire: ';
      ennDesire.appendChild(desireLabel);
      const desireText = document.createElement('span');
      desireText.textContent = npc.enneagram.coreDesire;
      ennDesire.appendChild(desireText);
      left.appendChild(ennDesire);
    }

    cols.appendChild(left);

    // Right: Motives + Secrets + Relationships
    const right = document.createElement('div');
    right.className = 'dash-dossier-col';

    // Motives
    const npcMotives = world.motives.filter(m => m.from === npc.id);
    if (npcMotives.length > 0) {
      const motiveTitle = document.createElement('div');
      motiveTitle.className = 'dash-dossier-subtitle';
      motiveTitle.textContent = 'Motives';
      right.appendChild(motiveTitle);

      for (const m of npcMotives) {
        const motiveItem = document.createElement('div');
        motiveItem.className = 'dash-dossier-motive';

        const motiveBar = document.createElement('div');
        motiveBar.className = 'dash-dossier-motive-bar';
        motiveBar.style.setProperty('--motive-color', MOTIVE_COLORS[m.type] || 'var(--warning)');
        motiveBar.style.setProperty('--motive-pct', (m.confidence * 100) + '%');
        motiveItem.appendChild(motiveBar);

        const motiveLabel = document.createElement('div');
        motiveLabel.className = 'dash-dossier-motive-label';
        const targetNpc = world.npcs.find(n => n.id === m.to);
        motiveLabel.textContent = m.type.replace(/_/g, ' ').toLowerCase() + ' \u2192 ' + (targetNpc ? targetNpc.name : m.to);
        motiveItem.appendChild(motiveLabel);

        const motiveConf = document.createElement('span');
        motiveConf.className = 'dash-dossier-motive-conf';

    // Secrets

    if (npcRels.length > 0) {
      const relTitle = document.createElement('div');
      relTitle.className = 'dash-dossier-subtitle';

        relType.className = 'dash-dossier-rel-type';
        relType.textContent = r.type;
        relItem.appendChild(relType);

        const sentiment = r.sentiment ?? 0;
        const trust = r.trust ?? 0.5;

        const barWrap = document.createElement('div');
        barWrap.className = 'dash-dossier-rel-bars';

        // Sentiment bar
        const sentBar = document.createElement('div');
        sentBar.className = 'dash-dossier-rel-bar';
        const sentFill = document.createElement('div');
        sentFill.className = 'dash-dossier-rel-bar-fill';

        sentFill.style.setProperty('--bar-color', sentiment >= 0 ? 'var(--success)' : 'var(--danger)');
        sentFill.style.setProperty('--bar-dir', sentiment >= 0 ? 'right' : 'left');
        sentBar.appendChild(sentFill);
        barWrap.appendChild(sentBar);

        const sentLabel = document.createElement('span');
        sentLabel.className = 'dash-dossier-rel-bar-label';
        sentLabel.textContent = 'S:' + sentiment.toFixed(2);
        barWrap.appendChild(sentLabel);

        // Trust bar
        const trustBar = document.createElement('div');
        trustBar.className = 'dash-dossier-rel-bar';
        const trustFill = document.createElement('div');
        trustFill.className = 'dash-dossier-rel-bar-fill';
        trustFill.style.setProperty('--bar-pct', trust * 100 + '%');
        trustFill.style.setProperty('--bar-color', 'var(--accent)');
        trustFill.style.setProperty('--bar-dir', 'right');
        trustBar.appendChild(trustFill);
        barWrap.appendChild(trustBar);

        const trustLabel = document.createElement('span');
        trustLabel.className = 'dash-dossier-rel-bar-label';
        trustLabel.textContent = 'T:' + trust.toFixed(2);
        barWrap.appendChild(trustLabel);

        relItem.appendChild(barWrap);
        right.appendChild(relItem);
      }
    }

    cols.appendChild(right);
    dossier.appendChild(cols);

    // Scroll into view
    dossier.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  }

  function createRadarChart(personality, size) {
    const ns = 'http://www.w3.org/2000/svg';
    const svg = document.createElementNS(ns, 'svg');
    svg.setAttribute('width', String(size));
    svg.setAttribute('height', String(size));
    svg.setAttribute('viewBox', '0 0 ' + size + ' ' + size);
    svg.classList.add('dash-radar-svg');

    const traits = ['O', 'C', 'E', 'A', 'N', 'H'];
    const cx = size / 2;
    const cy = size / 2;
    const maxR = size / 2 - 24;
    const n = traits.length;

    // Draw concentric hexagons (grid)
    for (const level of [0.25, 0.5, 0.75, 1.0]) {
      const r = maxR * level;
      const points = [];
      for (let i = 0; i < n; i++) {
        const angle = (2 * Math.PI * i / n) - Math.PI / 2;
        points.push((cx + r * Math.cos(angle)).toFixed(1) + ',' + (cy + r * Math.sin(angle)).toFixed(1));
      }
      const hex = document.createElementNS(ns, 'polygon');
      hex.setAttribute('points', points.join(' '));
      hex.setAttribute('fill', 'none');
      hex.setAttribute('stroke', 'var(--border)');
      hex.setAttribute('stroke-width', level === 1.0 ? '1' : '0.5');
      hex.setAttribute('stroke-opacity', '0.5');
      svg.appendChild(hex);
    }

    // Draw axes
    for (let i = 0; i < n; i++) {
      const angle = (2 * Math.PI * i / n) - Math.PI / 2;
      const line = document.createElementNS(ns, 'line');
      line.setAttribute('x1', String(cx));
      line.setAttribute('y1', String(cy));
      line.setAttribute('x2', String(cx + maxR * Math.cos(angle)));
      line.setAttribute('y2', String(cy + maxR * Math.sin(angle)));
      line.setAttribute('stroke', 'var(--border)');
      line.setAttribute('stroke-width', '0.5');
      line.setAttribute('stroke-opacity', '0.4');
      svg.appendChild(line);
    }

    // Draw data polygon
    const dataPoints = [];
    for (let i = 0; i < n; i++) {
      const angle = (2 * Math.PI * i / n) - Math.PI / 2;
      const val = personality[traits[i]] || 0;
      const r = maxR * val;
      dataPoints.push((cx + r * Math.cos(angle)).toFixed(1) + ',' + (cy + r * Math.sin(angle)).toFixed(1));
    }
    const dataPolygon = document.createElementNS(ns, 'polygon');
    dataPolygon.setAttribute('points', dataPoints.join(' '));
    dataPolygon.setAttribute('fill', 'var(--accent)');
    dataPolygon.setAttribute('fill-opacity', '0.15');
    dataPolygon.setAttribute('stroke', 'var(--accent)');
    dataPolygon.setAttribute('stroke-width', '1.5');
    svg.appendChild(dataPolygon);

    // Data points (dots)
    for (let i = 0; i < n; i++) {
      const angle = (2 * Math.PI * i / n) - Math.PI / 2;
      const val = personality[traits[i]] || 0;
      const r = maxR * val;
      const dot = document.createElementNS(ns, 'circle');
      dot.setAttribute('cx', String(cx + r * Math.cos(angle)));
      dot.setAttribute('cy', String(cy + r * Math.sin(angle)));
      dot.setAttribute('r', '3');
      dot.setAttribute('fill', 'var(--accent)');
      svg.appendChild(dot);
    }

    // Labels
    for (let i = 0; i < n; i++) {
      const angle = (2 * Math.PI * i / n) - Math.PI / 2;
      const labelR = maxR + 16;
      const text = document.createElementNS(ns, 'text');
      text.setAttribute('x', String(cx + labelR * Math.cos(angle)));
      text.setAttribute('y', String(cy + labelR * Math.sin(angle)));
      text.setAttribute('text-anchor', 'middle');
      text.setAttribute('dominant-baseline', 'central');
      text.setAttribute('fill', 'var(--text-sec)');
      text.setAttribute('font-size', '11');
      text.setAttribute('font-weight', '600');
      text.setAttribute('font-family', 'var(--font)');
      text.textContent = traits[i];
      svg.appendChild(text);
    }

    return svg;
  }

  // ─── Section 6: Affordance Matrix ───

  function buildAffordanceMatrix(affordanceData) {
    const section = document.createElement('section');
    section.className = 'dash-section';
    const heading = document.createElement('h2');
    heading.className = 'dash-section-title';
    heading.textContent = 'Affordance Matrix';
    section.appendChild(heading);

    // Dynamic columns from actual registry categories
    const columns = {};
    for (const aff of affordanceData.affordances) {
      const cat = aff.category || 'other';
      if (!columns[cat]) columns[cat] = { label: cat.charAt(0).toUpperCase() + cat.slice(1), items: [] };
      columns[cat].items.push(aff);
    }

    const grid = document.createElement('div');
    grid.className = 'dash-affordance-grid';

    for (const [key, col] of Object.entries(columns)) {
      const column = document.createElement('div');
      column.className = 'dash-affordance-col';

      const colHeader = document.createElement('div');
      colHeader.className = 'dash-affordance-col-header';
      colHeader.textContent = col.label;
      column.appendChild(colHeader);

      for (const aff of col.items) {
        const card = document.createElement('div');
        card.className = 'dash-affordance-card';

        // Severity color stripe
        const severityHue = Math.max(0, 120 - aff.severity * 12);
        card.style.setProperty('--severity-color', 'hsl(' + severityHue + ', 65%, 50%)');

        const nameEl = document.createElement('div');
        nameEl.className = 'dash-affordance-name';
        nameEl.textContent = aff.name;
        card.appendChild(nameEl);

        const thresh = document.createElement('div');
        thresh.className = 'dash-affordance-threshold';
        thresh.textContent = aff.threshold;
        card.appendChild(thresh);

        if (aff.period) {
          const period = document.createElement('span');
          period.className = 'dash-affordance-period';
          period.textContent = aff.period;
          card.appendChild(period);
        }

        column.appendChild(card);
      }

      grid.appendChild(column);
    }

    section.appendChild(grid);
    return section;
  }

  // ─── Section: CG Rule Visualizer ───

  function buildCgVisualizer(cgData) {
    const section = document.createElement('section');
    section.className = 'dash-section';
    const heading = document.createElement('h2');
    heading.className = 'dash-section-title';
    heading.textContent = 'CG Cascade Rules';
    section.appendChild(heading);

    if (!cgData?.rules?.length) {
      section.innerHTML += '<div class="dash-pulse-empty">No CG rules loaded</div>';
      return section;
    }

    // Group by trigger
    const byTrigger = {};
    for (const rule of cgData.rules) {
      const t = rule.trigger || '?';
      if (!byTrigger[t]) byTrigger[t] = [];
      byTrigger[t].push(rule);
    }

    const container = document.createElement('div');
    container.className = 'dash-cg-container';

    for (const [trigger, rules] of Object.entries(byTrigger)) {
      const group = document.createElement('div');
      group.className = 'dash-cg-group';

      const triggerEl = document.createElement('div');
      triggerEl.className = 'dash-cg-trigger';
      triggerEl.textContent = trigger;
      group.appendChild(triggerEl);

      const arrow = document.createElement('div');
      arrow.className = 'dash-cg-arrow';
      arrow.textContent = '\u2192';
      group.appendChild(arrow);

      const consequences = document.createElement('div');
      consequences.className = 'dash-cg-consequences';

      for (const rule of rules) {
        const card = document.createElement('div');
        card.className = 'dash-cg-card';
        if (rule.exclusive) card.classList.add('dash-cg-card--exclusive');

        const name = document.createElement('div');
        name.className = 'dash-cg-card-name';
        name.textContent = rule.consequence || rule.id;
        card.appendChild(name);

        const meta = document.createElement('div');
        meta.className = 'dash-cg-card-meta';
        const parts = [];
        if (rule.targetMode !== 'affected') parts.push(rule.targetMode);
        if (rule.probability < 1) parts.push(Math.round(rule.probability * 100) + '%');
        if (rule.exclusive) parts.push('ex:' + rule.exclusive);
        if (rule.maxChainDepth) parts.push('depth:' + rule.maxChainDepth);
        meta.textContent = parts.join(' | ');
        card.appendChild(meta);

        consequences.appendChild(card);
      }

      group.appendChild(consequences);
      container.appendChild(group);
    }

    section.appendChild(container);
    return section;
  }

  // ─── Section: Invariant Explorer ───

  function buildInvariantExplorer(invData) {
    const section = document.createElement('section');
    section.className = 'dash-section';
    const heading = document.createElement('h2');
    heading.className = 'dash-section-title';
    heading.textContent = 'Invariants & Decisions (' + (invData?.total || 0) + ')';
    section.appendChild(heading);

    if (!invData?.invariants?.length) {
      section.innerHTML += '<div class="dash-pulse-empty">No invariants parsed</div>';
      return section;
    }

    const list = document.createElement('div');
    list.className = 'dash-invariant-list';

    for (const inv of invData.invariants) {
      const item = document.createElement('div');
      item.className = 'dash-invariant-item';

      const id = document.createElement('span');
      id.className = 'dash-invariant-num';
      id.textContent = inv.id;
      id.style.color = inv.type === 'invariant' ? 'var(--accent-red, #e74c3c)' : 'var(--accent-amber, #f39c12)';
      item.appendChild(id);

      const text = document.createElement('span');
      text.className = 'dash-invariant-text';
      text.textContent = inv.text;
      item.appendChild(text);

      list.appendChild(item);
    }

    section.appendChild(list);
    return section;
  }

  // ============================================================
  // INIT
  // ============================================================
  async function init() {
    await loadTree();

    // Restore last opened document or show dashboard
    const lastDoc = localStorage.getItem('dr-last-doc');
    if (lastDoc) {
      // Ensure parent folders are expanded
      expandParentFolders(lastDoc);
      navigateTo(lastDoc);
    } else {
      // Show dashboard as landing page
      showDashboard();
    }
  }

  function expandParentFolders(path) {
    if (path === '__CLAUDE_MD__') return;
    const parts = path.split('/');
    let accumulated = '';
    for (let i = 0; i < parts.length - 1; i++) {
      accumulated = accumulated ? accumulated + '/' + parts[i] : parts[i];
      expandedFolders.add(accumulated);
    }
    saveExpandedState();
    // Re-render tree to apply expansion
    renderTree(treeData);
  }

  init();
  </script>
